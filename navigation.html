<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Единая База Знаний / Project Moon 5e</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:ital,wght@0,300;1,300;1,700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<style>
:root{
  --bg-main:#070707; --bg-panel:#000; --panel-soft:rgba(255,255,255,.02);
  --text-main:#E0D8C8; --text-dim:#696969;
  --accent-primary:#45B3CB; --accent-muted:#2c6e7d;
  --color-red:#C7243A; --color-cyan:#45B3CB; --color-yellow:#F1C40F; --color-magenta:#D94285;
  --border-width:1px; --chamfer:14px;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  background-color:var(--bg-main);color:var(--text-main);font-family:'Inter',sans-serif;
  min-height:100vh;padding:56px 20px 40px;display:flex;flex-direction:column;align-items:center;
  background-image:linear-gradient(rgba(7,7,7,.82),rgba(7,7,7,.82)),repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.02) 2px,rgba(255,255,255,.02) 4px);
  overflow-x:hidden;
}
h1,h2,h3,h4,.oswald{font-family:'Oswald',sans-serif;text-transform:uppercase}
.tech-text{font-family:'Inter',sans-serif;color:var(--accent-primary);font-size:.8rem}
.lore-text{font-family:'Merriweather',serif;font-style:italic;color:var(--text-dim);font-size:.9rem;line-height:1.6;white-space:pre-wrap}
.wrap{width:100%;max-width:1200px}

/* ---------- Верхняя панель ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:46px;z-index:500;background:rgba(7,7,7,.94);
  border-bottom:1px solid #1c1c1c;display:flex;align-items:center;gap:10px;padding:0 16px;backdrop-filter:blur(4px)}
.tb-btn{padding:5px 10px;font-size:.78rem;font-family:'Oswald',sans-serif;background:transparent;text-decoration:none;
  display:flex;align-items:center;gap:6px;cursor:pointer;text-transform:uppercase;transition:.2s;border:1px solid var(--text-dim);color:var(--text-dim);border-radius:2px}
.tb-btn:hover{border-color:var(--accent-primary);color:var(--accent-primary)}
.tb-btn.accent{border-color:var(--accent-primary);color:var(--accent-primary)}
.tb-btn.accent:hover{background:var(--accent-primary);color:#000}
.tb-spacer{flex:1}
.tb-user{font-size:.78rem;color:var(--text-dim);font-family:'Inter',sans-serif}
.src-switch{display:flex;border:1px solid #333;border-radius:2px;overflow:hidden}
.src-switch button{padding:5px 10px;font-size:.72rem;font-family:'Oswald',sans-serif;background:transparent;border:none;
  color:var(--text-dim);cursor:pointer;text-transform:uppercase;transition:.2s;border-right:1px solid #333}
.src-switch button:last-child{border-right:none}
.src-switch button:hover{color:var(--text-main)}
.src-switch button.active{background:var(--accent-primary);color:#000}

/* ---------- Вкладки категорий ---------- */
.cat-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.cat-btn{padding:7px 14px;border:1px solid #333;background:rgba(0,0,0,.5);color:var(--text-dim);
  font-family:'Oswald',sans-serif;font-size:.92rem;cursor:pointer;transition:.2s;text-transform:uppercase;
  display:flex;align-items:center;gap:7px;border-radius:2px}
.cat-btn:hover{border-color:var(--text-main);color:var(--text-main)}
.cat-btn.active{color:#000;font-weight:500}

.header-bar{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px;
  border-bottom:1px solid var(--accent-muted);padding-bottom:10px}
.header-title{color:var(--accent-primary);font-size:1.7rem;letter-spacing:2px;text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase}
.header-subtitle{color:var(--text-dim);font-size:.85rem;text-align:center}

/* ---------- Панель действий ---------- */
.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.action-btn{flex:1;min-width:180px;padding:9px;font-size:.85rem;font-family:'Oswald',sans-serif;cursor:pointer;
  border:1px solid var(--accent-primary);color:var(--accent-primary);background:transparent;text-transform:uppercase;
  transition:.2s;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:2px}
.action-btn:hover{background:var(--accent-primary);color:#000}
.action-btn.ghost{border-color:var(--text-dim);color:var(--text-dim)}
.action-btn.ghost:hover{background:var(--text-dim);color:#000}

/* ---------- Фильтры ---------- */
.filters-section{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.search-wrapper{background-color:var(--accent-muted);padding:var(--border-width);transition:background-color .2s}
.search-wrapper:focus-within{background-color:var(--accent-primary)}
.search-inner{background:rgba(0,0,0,.7);display:flex;align-items:center}
.search-icon{padding-left:14px;font-size:.9rem;color:var(--text-dim)}
.search-input{width:100%;background:transparent;border:none;color:var(--text-main);padding:9px 14px 9px 10px;
  font-family:'Inter',sans-serif;font-size:.95rem;outline:none}
.search-input::placeholder{color:var(--text-dim)}
.filter-group-title{font-family:'Oswald',sans-serif;color:var(--accent-primary);font-size:.85rem;
  border-bottom:1px dashed #333;padding-bottom:4px;margin-top:6px;display:flex;justify-content:space-between;align-items:baseline}
.filter-hint{color:var(--text-dim);font-size:.7rem;font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0}
.type-filters{display:flex;flex-wrap:wrap;gap:8px}
.filter-btn{display:flex;align-items:center;gap:6px;font-family:'Oswald',sans-serif;font-size:.82rem;text-transform:uppercase;
  border:1px solid var(--text-dim);color:var(--text-dim);background:rgba(0,0,0,.5);padding:4px 10px;cursor:pointer;
  transition:.2s;border-radius:2px}
.filter-btn:hover{border-color:var(--text-main);color:var(--text-main)}
.filter-btn.active{background:rgba(255,255,255,.06)}
.filter-btn .type-icon{width:14px;height:14px;object-fit:contain}
.result-count{color:var(--text-dim);font-size:.78rem;margin-bottom:12px;font-family:'Oswald',sans-serif;letter-spacing:1px}

/* ---------- Панели / карточки ---------- */
.panel-outer{background-color:var(--accent-primary);padding:var(--border-width);position:relative;display:flex;flex-direction:column}
.panel-inner{background-color:var(--bg-panel);padding:16px 20px;height:100%;display:flex;flex-direction:column}
.cut-tl{clip-path:polygon(var(--chamfer) 0,100% 0,100% 100%,0 100%,0 var(--chamfer))}
.hazard-tape{height:6px;background:repeating-linear-gradient(45deg,#000 0,#000 10px,var(--accent-muted) 10px,var(--accent-muted) 20px);
  border-bottom:1px solid var(--accent-primary)}

.compendium-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;align-items:stretch}
.card{transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.55)}
.card.expanded{grid-column:1/-1;transform:none}

/* Свёрнутая карточка держит одинаковую высоту — без «лесенки» */
.card-head{cursor:pointer;position:relative;padding-right:26px;user-select:none;
  min-height:118px;display:flex;flex-direction:column}
.card.expanded .card-head{min-height:0}
.expand-icon{position:absolute;right:0;top:8px;color:var(--text-dim);transition:transform .3s ease}
.card.expanded .expand-icon{transform:rotate(180deg);color:var(--accent-primary)}
.card-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  border-bottom:1px solid #222;padding-bottom:8px;margin-bottom:8px}
.card-title{font-size:1.3rem;color:var(--accent-primary);font-family:'Oswald',sans-serif;text-transform:uppercase;
  line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.expanded .card-title{-webkit-line-clamp:unset;overflow:visible}
.card-meta{font-size:.75rem;color:var(--text-dim);font-family:'Inter',sans-serif;margin-bottom:2px}
.card-meta.italic{font-style:italic}
.level-badge{align-self:flex-start;background:var(--accent-primary);color:#000;font-family:'Oswald',sans-serif;
  font-size:.72rem;padding:2px 6px;border-radius:2px;margin-bottom:4px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-content:flex-start}
.badge{display:flex;align-items:center;gap:5px;font-family:'Oswald',sans-serif;font-size:.75rem;text-transform:uppercase;
  border:1px solid;padding:2px 7px;border-radius:2px;background:rgba(0,0,0,.5);white-space:nowrap}
.badge .type-icon{width:15px;height:15px;object-fit:contain}
.badge-origin{border-color:var(--color-magenta);color:var(--color-magenta)}
.badge-private{border-color:var(--color-red);color:var(--color-red)}

/* Режим отображения бейджей у Архетипов */
body[data-badge="types"] .badge-stat{display:none!important}
body[data-badge="stats"] .badge-type{display:none!important}

/* Раскрытие: без magic numbers */
.card-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease;opacity:0}
.card.expanded .card-body{grid-template-rows:1fr;opacity:1;margin-top:10px}
.card-body>.card-body-inner{overflow:hidden;min-height:0}

.sub-block{margin-bottom:10px;border-left:2px solid var(--text-dim);padding:8px 10px;cursor:pointer;
  background:var(--panel-soft);transition:background .2s}
.sub-block:last-child{margin-bottom:0}
.sub-block:hover{background:rgba(255,255,255,.05)}
.sub-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sub-head-left{display:flex;align-items:baseline;gap:8px}
.sub-name{font-family:'Oswald',sans-serif;font-size:1.05rem}
.sub-level{color:var(--text-dim);font-size:.72rem;font-family:'Inter',sans-serif}
.sub-icon{color:var(--text-dim);font-size:.75rem;transition:transform .3s}
.sub-block.collapsed .sub-icon{transform:rotate(-90deg)}
.sub-desc-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease;margin-top:6px}
.sub-block.collapsed .sub-desc-wrap{grid-template-rows:0fr;margin-top:0}
.sub-desc{overflow:hidden;font-size:.88rem;line-height:1.5}

.req-text{color:var(--color-red);font-size:.82rem;font-family:'Oswald',sans-serif;text-transform:uppercase;margin-bottom:8px}
.creator-tag{font-size:.7rem;color:var(--text-dim);text-align:right;margin-top:10px;font-style:italic}
.card-controls{display:flex;gap:8px;margin-top:12px;border-top:1px solid #222;padding-top:12px;flex-wrap:wrap}
.ctrl-btn{flex:1;min-width:74px;background:transparent;border:1px solid;padding:6px;font-size:.72rem;
  font-family:'Oswald',sans-serif;cursor:pointer;text-transform:uppercase;transition:.2s;border-radius:2px}
.ctrl-pick{border-color:var(--text-dim);color:var(--text-dim)}
.ctrl-pick:hover{border-color:var(--accent-primary);color:var(--accent-primary)}
.ctrl-pick.on{border-color:var(--accent-primary);color:var(--accent-primary);background:rgba(255,255,255,.07)}
.ctrl-copy{border-color:var(--color-cyan);color:var(--color-cyan)}
.ctrl-copy:hover{background:var(--color-cyan);color:#000}
.ctrl-dl{border-color:var(--text-main);color:var(--text-main)}
.ctrl-dl:hover{background:var(--text-main);color:#000}
.ctrl-edit{border-color:var(--color-yellow);color:var(--color-yellow)}
.ctrl-edit:hover{background:var(--color-yellow);color:#000}
.ctrl-del{border-color:var(--color-red);color:var(--color-red)}
.ctrl-del:hover{background:var(--color-red);color:#fff}
.ctrl-priv{border-color:#555;color:#555}
.ctrl-priv:hover{border-color:var(--color-red);color:var(--color-red)}

/* Стат-блок бестиария */
.stat-line{margin-bottom:4px;font-size:.88rem}
.stat-line strong{color:var(--accent-primary);font-family:'Oswald',sans-serif;letter-spacing:1px}
.stat-grid{display:flex;justify-content:space-between;text-align:center;margin:12px 0;padding:12px 0;
  border-top:2px solid var(--accent-primary);border-bottom:2px solid var(--accent-primary)}
.stat-col{display:flex;flex-direction:column;width:16%}
.stat-name{font-family:'Oswald',sans-serif;color:var(--accent-primary);font-size:.95rem}
.stat-val{font-size:.85rem;font-weight:bold}
.section-sub{font-family:'Oswald',sans-serif;font-size:.95rem;border-bottom:1px dashed #333;
  margin:14px 0 8px;padding-bottom:4px;letter-spacing:1px}

/* ---------- Markdown ---------- */
.md{line-height:1.55;font-size:.9rem}
.md p{margin-bottom:8px}
.md p:last-child{margin-bottom:0}
.md strong,.md b{color:var(--accent-primary);font-family:'Oswald',sans-serif;font-weight:normal;letter-spacing:.5px}
.md em,.md i{color:var(--text-dim)}
.md ul,.md ol{margin:0 0 8px 20px}
.md li{margin-bottom:4px}
.md code{background:rgba(255,255,255,.1);padding:2px 4px;border-radius:3px;font-family:monospace;color:var(--color-yellow)}
.md blockquote{border-left:3px solid var(--accent-primary);padding-left:10px;color:var(--text-dim);font-style:italic}
.md table,.md-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.85rem;background:rgba(0,0,0,.3);display:block;overflow-x:auto}
.md th,.md td{border:1px solid #2a2a2a;padding:7px 11px;text-align:left;vertical-align:top}
.md th{background:rgba(255,255,255,.05);color:var(--accent-primary);font-family:'Oswald',sans-serif;text-transform:uppercase}
.md tr:nth-child(even){background:rgba(255,255,255,.02)}

/* ---------- Статьи (rules / lore / лор снаряжения) ---------- */
.article-host{display:flex;flex-direction:column;gap:30px}
.article-host .panel-inner{padding:28px}
.article-host .section-title{font-size:1.6rem;color:var(--accent-primary);margin-bottom:18px;border-bottom:1px solid #333;
  padding-bottom:8px;display:flex;align-items:center;gap:12px;font-family:'Oswald',sans-serif;text-transform:uppercase}
.article-host .rule-block{margin-bottom:22px}
.article-host .rule-block:last-child{margin-bottom:0}
.article-host .rule-title,.article-host .conflict-name{font-family:'Oswald',sans-serif;font-size:1.25rem;
  color:var(--color-cyan);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.article-host .conflict-name{color:#fff}
.article-host .rule-desc,.article-host .conflict-desc{font-size:.94rem;line-height:1.6}
.article-host .rule-desc p,.article-host .paragraph{margin-bottom:12px;text-align:justify}
.article-host .paragraph:last-child{margin-bottom:0}
.article-host .rule-desc ul{margin:0 0 12px 20px}
.article-host .rule-desc li{margin-bottom:6px}
.article-host .highlight{color:var(--accent-primary);font-weight:bold;font-family:'Oswald',sans-serif;letter-spacing:1px}
.article-host .warning-text{color:var(--color-red);font-weight:bold}
.article-host .quote-block{border-left:3px solid var(--accent-primary);margin:16px 0;background:var(--panel-soft);
  padding:12px 16px;font-style:italic;color:#ccc}
.article-host .conflict-block,.article-host .info-block{border-left:3px solid var(--accent-primary);margin-bottom:22px;
  background:var(--panel-soft);padding:16px 16px 16px 20px;border-radius:0 4px 4px 0}
.article-host .conflict-block:last-child,.article-host .info-block:last-child{margin-bottom:0}
.article-host .date-badge{display:inline-block;background:var(--accent-muted);font-family:'Oswald',sans-serif;
  font-size:.78rem;padding:2px 8px;border-radius:2px;margin-left:10px;vertical-align:middle}
.article-host .lore-text{color:var(--text-main);font-style:normal;white-space:normal}
.subtabs{display:flex;gap:10px;margin-bottom:20px}
.subtab{flex:1;padding:11px;background:rgba(0,0,0,.5);border:1px solid var(--text-dim);color:var(--text-dim);
  font-family:'Oswald',sans-serif;font-size:1rem;cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:1px}
.subtab:hover{border-color:var(--accent-primary);color:var(--accent-primary)}
.subtab.active{border-color:var(--accent-primary);color:var(--text-main);background:rgba(255,255,255,.07)}

/* ---------- Правый сайдбар (Сборка / Основа) ---------- */
.side-toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:600;display:flex;flex-direction:column;gap:6px}
.side-toggle button{writing-mode:vertical-rl;padding:14px 7px;background:var(--bg-main);border:1px solid var(--accent-primary);
  border-right:none;color:var(--accent-primary);font-family:'Oswald',sans-serif;font-size:.8rem;cursor:pointer;
  text-transform:uppercase;letter-spacing:1px}
.side-toggle button:hover{background:var(--accent-primary);color:#000}
.side-count{background:var(--accent-primary);color:#000;border-radius:8px;padding:0 5px;font-size:.7rem;margin-top:6px;writing-mode:horizontal-tb;display:inline-block}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:900;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(3px)}
.sidebar-overlay.active{opacity:1;pointer-events:all}
.sidebar{position:fixed;top:0;right:-660px;width:660px;max-width:92vw;height:100vh;background:var(--bg-main);
  border-left:2px solid var(--accent-primary);z-index:950;transition:right .3s ease;overflow-y:auto;padding:24px 22px 40px;
  box-shadow:-10px 0 30px rgba(0,0,0,.8)}
.sidebar.active{right:0}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--accent-primary)}
.sidebar-title{font-size:1.5rem;color:var(--text-main);border-bottom:2px solid var(--accent-primary);padding-bottom:8px;
  margin-bottom:14px;font-family:'Oswald',sans-serif;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.sidebar-h2{font-size:1.1rem;color:var(--accent-primary);border-bottom:1px solid #333;margin:20px 0 10px;
  padding-bottom:4px;font-family:'Oswald',sans-serif;text-transform:uppercase}
.sidebar-empty{color:var(--text-dim);font-size:.88rem;line-height:1.5}
.pick-entry{border:1px solid #262626;border-left:3px solid var(--accent-primary);padding:10px 12px;margin-bottom:10px;background:var(--panel-soft)}
.pick-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pick-name{font-family:'Oswald',sans-serif;font-size:1.02rem;color:var(--text-main)}
.pick-actions{display:flex;gap:6px}
.mini-btn{background:transparent;border:1px solid var(--text-dim);color:var(--text-dim);cursor:pointer;padding:3px 7px;
  font-size:.7rem;font-family:'Oswald',sans-serif;text-transform:uppercase;transition:.2s;border-radius:2px}
.mini-btn:hover{border-color:var(--accent-primary);color:var(--accent-primary)}
.mini-btn.danger:hover{border-color:var(--color-red);color:var(--color-red)}

/* ---------- Модалки ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:flex-start;
  z-index:2000;backdrop-filter:blur(4px);padding:50px 12px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal-box{width:820px;max-width:100%;position:relative;margin-bottom:50px}
.modal-box.narrow{width:420px}
.btn-close-modal{background:transparent;border:none;color:var(--color-red);font-size:1.5rem;cursor:pointer;
  position:absolute;right:14px;top:14px;z-index:10}
.btn-close-modal:hover{color:#ff0044}
.cloud-input,.cloud-select{width:100%;background:#111;border:1px solid #333;color:var(--text-main);padding:9px;
  margin-bottom:10px;outline:none;font-family:'Inter',sans-serif;font-size:.92rem}
.cloud-input:focus,.cloud-select:focus{border-color:var(--accent-primary)}
textarea.cloud-input{resize:vertical;min-height:80px}
.b-row{display:flex;gap:10px;flex-wrap:wrap}
.b-row>div{flex:1;min-width:120px}
.check-group{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.check-label{display:flex;align-items:center;gap:5px;font-size:.85rem;cursor:pointer;color:var(--text-dim)}
.check-label input{accent-color:var(--accent-primary)}
.check-label:hover{color:var(--text-main)}
.b-entry{border:1px solid #333;border-left:3px solid var(--accent-primary);padding:12px;margin-bottom:12px;
  position:relative;background:var(--panel-soft)}
.b-entry .cloud-input{margin-bottom:8px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #333;
  padding-bottom:8px;margin:16px 0 12px}

/* Панель Markdown над текстовыми полями */
.md-editor{margin-bottom:10px}
.md-editor textarea{margin-bottom:0}
.md-toolbar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;align-items:center}
.md-toolbar button{background:#0d0d0d;border:1px solid #2e2e2e;color:var(--text-dim);cursor:pointer;
  min-width:30px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.78rem;
  font-family:'Oswald',sans-serif;transition:.15s;border-radius:2px;padding:0 6px}
.md-toolbar button:hover{border-color:var(--accent-primary);color:var(--accent-primary);background:#141414}

/* ============================================================
   5. ЗАГРУЗКА ДАННЫХ
   ============================================================ */
async function loadJson(file){
  if (state.canonCache[file]) return state.canonCache[file];
  const res = await fetch(file);
  if (!res.ok) throw new Error(`Файл ${file} не найден`);
  const data = await res.json();
  const list = (Array.isArray(data) ? data : [data]).map(x => ({ ...x, __origin:"canon" }));
  state.canonCache[file] = list;
  return list;
}

async function loadCustom(force=false){
  if (state.customLoaded && !force) return state.customCache;
  const seen = new Map();
  const push = snap => snap.forEach(d => {
    const raw = d.data();
    seen.set(d.id, {
      ...(raw.data || {}),
      __origin:"custom", __id:d.id, __type:raw.type,
      __creator:raw.creator || "—", __owner:raw.creatorEmail || "", __private:!!raw.isPrivate
    });
  });
  try {
    if (state.isAdmin){
      push(await getDocs(collection(db, COLL)));            // админ видит всё
    } else {
      push(await getDocs(query(collection(db, COLL), where("isPrivate","==",false))));
      if (state.user)
        push(await getDocs(query(collection(db, COLL), where("creatorEmail","==",state.user.email))));
    }
    state.customCache = [...seen.values()];
    state.customLoaded = true;
  } catch(e){
    console.error(e);
    state.customCache = [];
    state.customLoaded = true;
    toast("Не удалось прочитать пользовательскую базу");
  }
  return state.customCache;
}

async function currentItems(){
  const c = catCfg();
  let canon = [], custom = [];
  if (state.source !== "custom"){
    try {
      if (c.systems) canon = (await loadJson(c.systems[state.system].list)).map(x => ({ ...x, __sys:state.system }));
      else if (c.src) canon = await loadJson(c.src);
    } catch(e){ canon = []; throw e; }
  }
  if (state.source !== "canon" && c.customType){
    const all = await loadCustom();
    custom = all.filter(x => x.__type === c.customType);
  }
  return [...canon, ...custom].sort(c.sort || ((a,b)=>0));
}

function applyTheme(color){
  const root = document.documentElement.style;
  root.setProperty("--accent-primary", color);
  root.setProperty("--accent-muted", color + "55");
}
async function setCategory(id){
  state.cat = id;
  state.search = "";
  state.filters = {};
  state.subtab = "data";
  const c = catCfg();
  applyTheme(c.color);
  renderTabs();
  $("#page-title").textContent = c.title;
  $("#page-sub").textContent = c.sub || "";
  $("#system-select").style.display = c.systems ? "" : "none";
  $("#btn-base").style.display = c.systems ? "" : "none";
  $("#src-switch").style.visibility = c.kind === "data" ? "visible" : "hidden";
  renderSubtabs();
  if (c.systems) loadBase();
  await renderView();
}
function renderSubtabs(){
  const c = catCfg(), el = $("#subtabs");
  if (c.kind === "data" && c.article){
    el.style.display = "flex";
    el.innerHTML = `<button class="subtab${state.subtab==="data"?" active":""}" data-act="set-subtab" data-sub="data">База данных</button>
      <button class="subtab${state.subtab==="article"?" active":""}" data-act="set-subtab" data-sub="article">${esc(c.article.label)}</button>`;
  } else el.style.display = "none";
}

/* ============================================================
   7. ФИЛЬТРЫ
   ============================================================ */
function renderFilters(){
  const c = catCfg();
  let html = `<div class="search-wrapper cut-tl"><div class="search-inner cut-tl">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search-input" class="search-input" value="${esc(state.search)}"
             placeholder="Поиск по названию и описанию…">
    </div></div>`;
  (c.filters || []).forEach(f => {
    if (f.mode && c.badgeModes && f.mode !== state.badgeMode) return;
    const sel = state.filters[f.key] || new Set();
    html += `<div class="filter-group-title">${esc(f.title)}
        <span class="filter-hint">несколько значений — «или»; разные группы — «и»</span></div>
      <div class="type-filters">
        <button class="filter-btn${sel.size===0?" active":""}" data-act="clear-filter" data-key="${esc(f.key)}"
          style="${sel.size===0?"border-color:var(--accent-primary);color:var(--accent-primary)":""}">Все</button>`;
    Object.entries(DICT[f.dict]).forEach(([k,d]) => {
      const on = sel.has(k);
      html += `<button class="filter-btn${on?" active":""}" data-act="toggle-filter" data-key="${esc(f.key)}" data-val="${esc(k)}"
        style="${on?`border-color:${esc(d.color)};color:${esc(d.color)}`:""}">${iconFor(d)} ${esc(d.name)}</button>`;
    });
    html += `</div>`;
  });
  $("#filters").innerHTML = html;
}
function matches(it){
  const c = catCfg();
  for (const f of (c.filters || [])){
    const sel = state.filters[f.key];
    if (!sel || sel.size === 0) continue;
    const vals = arr(it[f.key]).map(String);
    if (!vals.some(v => sel.has(v))) return false;
  }
  if (state.search){
    const q = state.search.toLowerCase();
    const hay = (String(it.Name || "") + " " + (c.plain ? c.plain(it) : "")).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function cardHtml(it){

const articleCache = {};
async function renderArticle(a){
  const host = $("#article-view");
  if (articleCache[a.src + a.pick]){ host.innerHTML = articleCache[a.src + a.pick]; return; }
  host.innerHTML = `<div class="notice">Загрузка материала…</div>`;
  try {
    const res = await fetch(a.src);
    if (!res.ok) throw new Error(`${a.src} недоступен`);
    const dom  = new DOMParser().parseFromString(await res.text(), "text/html");
    const node = dom.querySelector(a.pick);
    if (!node) throw new Error(`Блок ${a.pick} не найден в ${a.src}`);
    articleCache[a.src + a.pick] = node.innerHTML;
    host.innerHTML = node.innerHTML;
  } catch(e){
    host.innerHTML = `<div class="notice error">Не удалось загрузить материал.<br>
      <span style="font-size:.8rem;color:var(--text-dim)">${esc(e.message)}</span><br>
      <a href="${esc(a.src)}" class="tb-btn" style="display:inline-flex;margin-top:12px">Открыть страницу напрямую</a></div>`;
  }
}

const MD_TOOLS = [
  { k:"bold",   h:"<b>Ж</b>",                              t:"Жирный  **текст**" },
  { k:"italic", h:"<i>К</i>",                              t:"Курсив  *текст*" },
  { k:"code",   h:'<i class="fa-solid fa-code"></i>',      t:"Моноширинный  `текст`" },
  { k:"sep" },
  { k:"h",      h:"H",                                     t:"Подзаголовок  ### текст" },
  { k:"ul",     h:'<i class="fa-solid fa-list-ul"></i>',   t:"Маркированный список" },
  { k:"ol",     h:'<i class="fa-solid fa-list-ol"></i>',   t:"Нумерованный список" },
  { k:"quote",  h:'<i class="fa-solid fa-quote-left"></i>',t:"Цитата" },
  { k:"hr",     h:'<i class="fa-solid fa-minus"></i>',     t:"Разделитель" },
  { k:"sep" },
  { k:"table",  h:'<i class="fa-solid fa-table"></i>',     t:"Редактор таблицы" },
  { k:"image",  h:'<i class="fa-solid fa-image"></i>',     t:"Вставить картинку" }
];
const mdToolbar = () => `<div class="md-toolbar">${MD_TOOLS.map(b =>
    b.k === "sep" ? `<span class="md-sep"></span>`
    : `<button type="button" data-act="md-ins" data-md="${b.k}" title="${esc(b.t)}">${b.h}</button>`).join("")}
  <span class="md-spacer"></span>
  <button type="button" class="on" data-act="md-preview" title="Показать или скрыть предпросмотр">
    <i class="fa-solid fa-eye"></i></button></div>`;

const mdField = (f, val) => `<div class="md-editor">${mdToolbar()}
  <textarea class="cloud-input" data-f="${esc(f.k)}" placeholder="Поддерживается Markdown">${esc(val ?? "")}</textarea>
  <div class="md-preview"${String(val ?? "").trim() ? "" : " hidden"}>
    <div class="md-preview-label"><span>Предпросмотр</span></div>
    <div class="md md-preview-body">${md(val ?? "")}</div>
  </div></div>`;

function refreshPreview(ta){
  const wrap = ta.closest(".md-editor"); if (!wrap) return;
  const box = wrap.querySelector(".md-preview");
  const btn = wrap.querySelector('[data-act="md-preview"]');
  if (!box || !btn.classList.contains("on")) return;
  const text = ta.value.trim();
  box.hidden = !text;
  if (text) wrap.querySelector(".md-preview-body").innerHTML = md(ta.value);
}

function mdInsert(ta, kind){
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const lines = t => (sel || t).split("\n");
  let out, caret;

  const inline = (mark, ph) => { out = mark + (sel || ph) + mark; caret = s + mark.length + (sel || ph).length; };
  const block  = txt => {
    const pre = (s > 0 && ta.value[s-1] !== "\n") ? "\n" : "";
    out = pre + txt; caret = s + out.length;
  };

  switch(kind){
    case "bold":   inline("**", "текст"); break;
    case "italic": inline("*",  "текст"); break;
    case "code":   inline("`",  "код");   break;
    case "h":      block(lines("Подзаголовок").map(l => "### " + l).join("\n")); break;
    case "ul":     block(lines("пункт").map(l => "- " + l).join("\n")); break;
    case "ol":     block(lines("пункт").map((l,i) => `${i+1}. ${l}`).join("\n")); break;
    case "quote":  block(lines("цитата").map(l => "> " + l).join("\n")); break;
    case "hr":     block("\n---\n"); break;
    default: return;
  }
  ta.value = ta.value.slice(0, s) + out + ta.value.slice(e);
  ta.focus();
  ta.setSelectionRange(caret, caret);
  refreshPreview(ta);
}

/* ---- Редактор таблиц и вставка картинок ---- */
const ALIGN_CYCLE = ["none","left","center","right"];
const ALIGN_GLYPH = { none:"—", left:"⟵", center:"⟷", right:"⟶" };
const ALIGN_MD    = { none:"---", left:":---", center:":---:", right:"---:" };
let activeTA = null, toolKind = null, tbl = null, tblRange = null;

function emptyTable(){ return { align:["none","none"], rows:[["Столбец 1","Столбец 2"],["",""],["",""]] }; }

/* Ищем markdown-таблицу, внутри которой стоит курсор */
function tableAtCursor(ta){
  const text = ta.value, pos = ta.selectionStart;
  const starts = [0]; for (let i = 0; i < text.length; i++) if (text[i] === "\n") starts.push(i+1);
  const lineAt = p => { let i = 0; while (i+1 < starts.length && starts[i+1] <= p) i++; return i; };
  const lineText = i => text.slice(starts[i], i+1 < starts.length ? starts[i+1]-1 : text.length);
  const isRow = i => i >= 0 && i < starts.length && lineText(i).trim().startsWith("|");

  let a = lineAt(pos); if (!isRow(a)) return null;
  let b = a;
  while (isRow(a-1)) a--;
  while (isRow(b+1)) b++;
  const raw = [];
  for (let i = a; i <= b; i++) raw.push(lineText(i).trim());
  if (raw.length < 2) return null;
  const cells = l => l.replace(/^\||\|$/g,"").split("|").map(c => c.trim());
  const sepCells = cells(raw[1]);
  if (!sepCells.every(c => /^:?-{2,}:?$/.test(c))) return null;

  const align = sepCells.map(c => c.startsWith(":") && c.endsWith(":") ? "center"
                                : c.endsWith(":") ? "right"
                                : c.startsWith(":") ? "left" : "none");
  const rows = [cells(raw[0]), ...raw.slice(2).map(cells)];
  const cols = align.length;
  rows.forEach(r => { while (r.length < cols) r.push(""); r.length = cols; });
  return { table:{ align, rows }, range:{ start:starts[a], end:starts[b] + raw[b-a].length } };
}
function tableToMd(t){
  const line = cs => "| " + cs.map(c => String(c).replace(/\|/g,"\\|").trim() || " ").join(" | ") + " |";
  return [line(t.rows[0]), "| " + t.align.map(a => ALIGN_MD[a]).join(" | ") + " |",
          ...t.rows.slice(1).map(line)].join("\n");
}
function renderTableEditor(){
  const cols = tbl.align.length;
  const cell = (r,c) => `<input data-r="${r}" data-c="${c}" value="${esc(tbl.rows[r][c] ?? "")}">`;
  let g = `<div class="tbl-hdr">${tbl.align.map((a,c) =>
      `<div style="flex:1;display:flex;gap:3px;min-width:110px">${cell(0,c)}
        <button type="button" class="tbl-align" data-act="tbl-align" data-c="${c}"
          title="Выравнивание столбца">${ALIGN_GLYPH[a]}</button></div>`).join("")}</div>`;
  g += `<div class="tbl-grid" style="grid-template-columns:repeat(${cols},minmax(110px,1fr));margin-top:4px">`;
  for (let r = 1; r < tbl.rows.length; r++) for (let c = 0; c < cols; c++) g += cell(r,c);
  g += `</div>`;
  $("#tool-body").innerHTML = `
    <div class="tool-hint">Первая строка — заголовок. Кнопка справа от заголовка переключает выравнивание столбца.
      Если курсор стоял внутри существующей таблицы, она уже загружена сюда и будет заменена целиком.</div>
    <div class="tbl-ctrls">
      <button class="mini-btn" data-act="tbl-col-add">+ столбец</button>
      <button class="mini-btn danger" data-act="tbl-col-del">− столбец</button>
      <button class="mini-btn" data-act="tbl-row-add">+ строка</button>
      <button class="mini-btn danger" data-act="tbl-row-del">− строка</button>
    </div>
    <div class="tbl-scroll">${g}</div>`;
}
function syncTable(){
  $("#tool-body").querySelectorAll("input[data-r]").forEach(i => {
    tbl.rows[+i.dataset.r][+i.dataset.c] = i.value;
  });
}
function renderImageTool(){
  $("#tool-body").innerHTML = `
    <div class="tool-hint">Вставится как <code>[ссылка W:ширина H:высота]</code>. Оставьте размеры пустыми —
      картинка впишется в ширину блока с сохранением пропорций. Указан только один размер — второй посчитается сам.</div>
    <div class="tech-text" style="margin-bottom:4px">Ссылка на изображение</div>
    <input type="text" id="img-url" class="cloud-input" placeholder="https://… или Burn.png">
    <div class="b-row">
      <div><div class="tech-text" style="margin-bottom:4px">Ширина, px</div>
        <input type="number" id="img-w" class="cloud-input" placeholder="авто" min="1"></div>

}
function openTool(kind, ta){
  activeTA = ta; toolKind = kind; tblRange = null;
  $("#tool-title").textContent = kind === "table" ? "Редактор таблицы" : "Вставка изображения";
  if (kind === "table"){
    const found = tableAtCursor(ta);
    tbl = found ? found.table : emptyTable();
    tblRange = found ? found.range : null;
    renderTableEditor();
  } else renderImageTool();
  $("#toolModal").classList.add("active");
}
function applyTool(){
  if (!activeTA) return;
  let text;
  if (toolKind === "table"){ syncTable(); text = tableToMd(tbl); }
  else {
    const url = $("#img-url").value.trim();
    if (!url) return toast("Укажите ссылку на изображение");
    const w = $("#img-w").value.trim(), h = $("#img-h").value.trim();
    text = `[${url}${w ? " W:" + w : ""}${h ? " H:" + h : ""}]`;
  }
  const ta = activeTA;
  if (toolKind === "table" && tblRange){
    ta.value = ta.value.slice(0, tblRange.start) + text + ta.value.slice(tblRange.end);
    ta.setSelectionRange(tblRange.start + text.length, tblRange.start + text.length);
  } else {
    const s = ta.selectionStart, e = ta.selectionEnd;
    const pre = (s > 0 && ta.value[s-1] !== "\n") ? "\n" : "";
    ta.value = ta.value.slice(0, s) + pre + text + "\n" + ta.value.slice(e);
    const caret = s + pre.length + text.length + 1;
    ta.setSelectionRange(caret, caret);
  }
  $("#toolModal").classList.remove("active");
  ta.focus();
  refreshPreview(ta);
}

function fieldHtml(f, data){
  const val = data?.[f.k];
  const lbl = f.label ? `<div class="tech-text" style="margin-bottom:4px">${esc(f.label)}</div>` : "";
  switch(f.t){
    case "row":
      return `<div class="b-row">${f.of.map(x => `<div style="flex:${x.flex||1}">${fieldHtml(x, data)}</div>`).join("")}</div>`;
    case "text":
      return `${lbl}<input type="text" class="cloud-input" data-f="${esc(f.k)}" placeholder="${esc(f.ph||"")}" value="${esc(val ?? "")}">`;
    case "num":
      return `${lbl}<input type="number" class="cloud-input" data-f="${esc(f.k)}" value="${esc(val ?? f.def ?? 1)}" min="1">`;
    case "md":
      return `${lbl}${mdField(f, val)}`;
    case "bool":
      return `<div class="check-group"><label class="check-label">
        <input type="checkbox" data-f="${esc(f.k)}" ${val?"checked":""}> ${esc(f.label)}</label></div>`;
    case "select":
      return `${lbl}<select class="cloud-select" data-f="${esc(f.k)}" ${f.num?'data-num="1"':""}>${
        Object.entries(f.opts).map(([k,v]) => `<option value="${esc(k)}" ${String(val)===String(k)?"selected":""}>${esc(v)}</option>`).join("")}</select>`;
    case "checks":
      return `${lbl}<div class="check-group" data-checks="${esc(f.k)}">${
        Object.entries(DICT[f.dict]).map(([k,d]) => `<label class="check-label">
          <input type="checkbox" value="${esc(k)}" ${arr(val).includes(k)?"checked":""}> ${esc(d.name)}</label>`).join("")}</div>`;
    case "stats6":
      return `${lbl}<div class="b-row" data-stats6="${esc(f.k)}">${["STR","DEX","CON","INT","WIS","CHA"]
        .map(s => `<div><div class="tech-text">${s}</div>
          <input type="text" class="cloud-input" data-f="${s}" value="${esc(val?.[s] ?? "10 (+0)")}"></div>`).join("")}</div>`;
    case "repeat":
      return `<div class="sec-head"><div class="tech-text" style="color:var(--color-yellow)">${esc(f.label)}</div>
          <button class="mini-btn" data-act="repeat-add" data-key="${esc(f.k)}">+ Добавить</button></div>
        <div data-repeat="${esc(f.k)}">${arr(val).map(row => repeatRow(f, row)).join("")}</div>`;
    default: return "";
  }
}
function repeatRow(f, row){
  const inline = f.sub.filter(s => s.t !== "md");
  const blocks = f.sub.filter(s => s.t === "md");
  return `<div class="b-entry">
    <button class="mini-btn danger" style="position:absolute;right:10px;top:10px" data-act="repeat-del"><i class="fa-solid fa-trash"></i></button>
    <div class="b-row" style="width:calc(100% - 46px)">${inline.map(s => fieldHtml(s, row)).join("")}</div>
    ${blocks.map(s => fieldHtml(s, row)).join("")}
  </div>`;
}
const REPEAT_SPEC = {};
function openBuilder(data=null, isPrivate=false, editId=null){
  const c = catCfg();
  if (!state.user) return toast("Для создания контента нужно войти");
  state.editId = editId;
  $("#builder-title").textContent = editId ? `Редактирование: ${c.label}` : `Создать: ${c.label}`;
  $("#bf-private").checked = !!isPrivate;
  c.builder.forEach(f => { if (f.t === "repeat") REPEAT_SPEC[f.k] = f; });
  $("#builder-fields").innerHTML = c.builder.map(f => fieldHtml(f, data || {})).join("");
  $("#builderModal").classList.add("active");
}
function collectField(f, scope){
  switch(f.t){
    case "row": { const o = {}; f.of.forEach(x => Object.assign(o, collectField(x, scope))); return o; }
    case "bool": return { [f.k]: !!scope.querySelector(`[data-f="${CSS.escape(f.k)}"]`)?.checked };
    case "checks": return { [f.k]: [...scope.querySelectorAll(`[data-checks="${CSS.escape(f.k)}"] input:checked`)].map(i => i.value) };
    case "stats6": {
      const box = scope.querySelector(`[data-stats6="${CSS.escape(f.k)}"]`), o = {};
      ["STR","DEX","CON","INT","WIS","CHA"].forEach(s => o[s] = box?.querySelector(`[data-f="${s}"]`)?.value || "");
      return { [f.k]: o };
    }
    case "repeat": {
      const rows = [...scope.querySelectorAll(`[data-repeat="${CSS.escape(f.k)}"] > .b-entry`)].map(el => {
        const o = {};
        f.sub.forEach(s => {
          const inp = el.querySelector(`[data-f="${CSS.escape(s.k)}"]`);
          o[s.k] = s.t === "num" ? (parseInt(inp?.value) || 1) : (inp?.value || "");
        });
        return o;
      });
      return { [f.k]: rows };
    }
    case "num": return { [f.k]: parseInt(scope.querySelector(`[data-f="${CSS.escape(f.k)}"]`)?.value) || (f.def ?? 1) };
    case "select": {
      const el = scope.querySelector(`[data-f="${CSS.escape(f.k)}"]`);
      return { [f.k]: el?.dataset.num ? (parseInt(el.value) || 1) : (el?.value || "") };
    }
    default: {
      const v = scope.querySelector(`[data-f="${CSS.escape(f.k)}"]`)?.value ?? "";
      return { [f.k]: (f.nullable && v.trim() === "") ? null : v };
    }
  }
}
function collectBuilder(){
  const scope = $("#builder-fields"), out = {};
  catCfg().builder.forEach(f => Object.assign(out, collectField(f, scope)));
  return out;
}
async function saveEntry(){
  const c = catCfg(), data = collectBuilder();
  if (!String(data.Name || "").trim()) return toast("Название обязательно");
  const isPrivate = $("#bf-private").checked;
  const payload = { type:c.customType, data, isPrivate, updatedAt:new Date().toISOString() };
  if (!state.editId){
    payload.creatorEmail = state.user.email;
    payload.creator = localStorage.getItem("custom_nickname") || state.user.email.split("@")[0];
  }
  try {
    const id = state.editId || `${c.customType}_${Date.now()}`;
    await setDoc(doc(db, COLL, id), payload, { merge:true });
    $("#builderModal").classList.remove("active");
    state.editId = null;
    await loadCustom(true);
    await renderGrid();
    toast("Сохранено");
  } catch(e){
    console.error(e);
    toast("Ошибка сохранения — проверьте правила доступа Firestore");
  }
}

/* ============================================================
   13. АВТОРИЗАЦИЯ И АДМИНЫ
   ============================================================ */
/* Права админа лежат в Firestore: коллекция admins, id документа = email.
   Каждый читает только свой документ, поэтому список админов нигде не светится.
   BOOTSTRAP — страховка от блокировки, пока документы не созданы.
   После создания admins/<ваш email> этот массив можно удалить: реальные права
   всё равно проверяются правилами Firestore на сервере. */
const BOOTSTRAP_ADMINS = ["nikkitamatveev2009@gmail.com","pavlovichpavel03@gmail.com"];

async function resolveAdmin(user){
  if (!user) return false;
  try {
    const snap = await getDoc(doc(db, "admins", user.email));
    if (snap.exists()) return true;
  } catch { /* правила ещё не развёрнуты — падаем в запасной список */ }
  return BOOTSTRAP_ADMINS.includes(user.email);
}

onAuthStateChanged(auth, async user => {
  state.user = user || null;
  state.isAdmin = await resolveAdmin(user);
  const nick = user ? (localStorage.getItem("custom_nickname") || user.email.split("@")[0]) : "";
  $("#user-info").textContent = user ? (state.isAdmin ? nick + " · админ" : nick) : "";
  $("#auth-label").textContent = user ? "Профиль" : "Вход";
  $("#auth-unlogged").style.display = user ? "none" : "block";
  $("#auth-logged").style.display   = user ? "block" : "none";
  $("#admin-tools").style.display   = state.isAdmin ? "block" : "none";
  if (user) $("#auth-nickname").value = nick;
  state.customLoaded = false;
  if (catCfg().kind === "data" && state.subtab === "data") await renderGrid();
});

async function migrateFlags(){
  if (!state.isAdmin) return;
  try {
    const snap = await getDocs(collection(db, COLL));
    const broken = [];
    snap.forEach(d => { if (typeof d.data().isPrivate !== "boolean") broken.push(d.id); });
    if (!broken.length) return toast("Все записи в порядке");
    if (!confirm(`Найдено записей без флага приватности: ${broken.length}. Проставить им isPrivate: false?`)) return;
    for (const id of broken) await setDoc(doc(db, COLL, id), { isPrivate:false }, { merge:true });
    toast(`Исправлено записей: ${broken.length}`);
    await loadCustom(true); await renderGrid();
  } catch(e){ console.error(e); toast("Не удалось выполнить проверку"); }
}

/* ============================================================
   14. СОБЫТИЯ
   ============================================================ */
const closeSidebars = () => {
  $("#sb-picks").classList.remove("active");
  $("#sb-base").classList.remove("active");
  $("#sb-overlay").classList.remove("active");
};
const openSidebar = id => { closeSidebars(); $(id).classList.add("active"); $("#sb-overlay").classList.add("active"); };

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, uid = el.dataset.uid;

  switch(act){
    case "set-cat": await setCategory(el.dataset.cat); break;
    case "set-subtab": state.subtab = el.dataset.sub; renderSubtabs(); await renderView(); break;

    case "toggle-card": el.closest(".card")?.classList.toggle("expanded"); break;
    case "toggle-sub": ev.stopPropagation(); el.classList.toggle("collapsed"); break;

    case "toggle-filter": {
      const k = el.dataset.key;
      state.filters[k] = state.filters[k] || new Set();
      state.filters[k].has(el.dataset.val) ? state.filters[k].delete(el.dataset.val) : state.filters[k].add(el.dataset.val);
      renderFilters(); await renderGrid(); break;
    }
    case "clear-filter": state.filters[el.dataset.key] = new Set(); renderFilters(); await renderGrid(); break;

    case "pick": togglePick(uid); break;
    case "copy-item": { const it = findItem(uid); if (it) copyText(catCfg().plain(it)); break; }
    case "dl-item": { const it = findItem(uid); if (it) downloadJson([cleanCopy(it)], `${it.Name || "item"}.json`); break; }

    case "open-picks": openSidebar("#sb-picks"); break;
    case "open-base": openSidebar("#sb-base"); break;
    case "close-sidebars": closeSidebars(); break;
    case "pick-copy": { const p = state.picks.find(x => x.uid === uid); if (p) copyText(pickPlain(p)); break; }
    case "pick-remove": {
      state.picks = state.picks.filter(x => x.uid !== uid); savePicks(); renderPicks();
      if (catCfg().kind === "data" && state.subtab === "data") await renderGrid(); break;
    }
    case "picks-copy": copyText(state.picks.map(pickPlain).join("\n\n")); break;
    case "picks-export": downloadJson(state.picks.map(p => ({ category:p.cat, ...p.data })), "my-build.json"); break;
    case "picks-clear":
      if (confirm("Очистить всю сборку?")){ state.picks = []; savePicks(); renderPicks(); await renderGrid(); }
      break;

    case "auth": $("#authModal").classList.add("active"); break;
    case "close-modal": el.closest(".modal-overlay").classList.remove("active"); break;
    case "login":
      try { await signInWithEmailAndPassword(auth, $("#auth-email").value, $("#auth-pass").value);
            $("#authModal").classList.remove("active"); }
      catch(e){ toast("Ошибка входа"); console.error(e); } break;
    case "register":
      try { await createUserWithEmailAndPassword(auth, $("#auth-email").value, $("#auth-pass").value);
            $("#authModal").classList.remove("active"); }
      catch(e){ toast("Ошибка регистрации"); console.error(e); } break;
    case "logout": await signOut(auth); $("#authModal").classList.remove("active"); break;
    case "save-nick": {
      const n = $("#auth-nickname").value.trim();
      if (!n) return toast("Никнейм не может быть пустым");
      localStorage.setItem("custom_nickname", n);
      $("#user-info").textContent = state.isAdmin ? n + " · админ" : n;
      toast("Никнейм сохранён (для новых записей)"); break;
    }
    case "migrate": await migrateFlags(); break;

    case "new-entry": openBuilder(); break;
    case "edit-item": { const it = findItem(uid); if (it) openBuilder(cleanCopy(it), it.__private, it.__id); break; }
    case "toggle-priv": {
      const it = findItem(uid); if (!it) break;
      try { await setDoc(doc(db, COLL, it.__id), { isPrivate: !it.__private }, { merge:true });
            await loadCustom(true); await renderGrid(); }
      catch(e){ toast("Не удалось изменить приватность"); } break;
    }
    case "del-item": {
      const it = findItem(uid); if (!it) break;
      if (!confirm(`Удалить «${it.Name}» навсегда?`)) break;
      try { await deleteDoc(doc(db, COLL, it.__id)); await loadCustom(true); await renderGrid(); toast("Удалено"); }
      catch(e){ toast("Ошибка удаления"); } break;
    }
    case "builder-save": await saveEntry(); break;
    case "builder-download": {
      const d = collectBuilder();
      downloadJson([d], `${d.Name || "entry"}.json`); break;
    }
    case "md-ins": {
      ev.preventDefault();
      const ta = el.closest(".md-editor")?.querySelector("textarea");
      if (!ta) break;
      if (el.dataset.md === "table" || el.dataset.md === "image") openTool(el.dataset.md, ta);
      else mdInsert(ta, el.dataset.md);
      break;
    }
    case "md-preview": {
      ev.preventDefault();
      el.classList.toggle("on");
      const wrap = el.closest(".md-editor");
      const box = wrap.querySelector(".md-preview");
      if (el.classList.contains("on")) refreshPreview(wrap.querySelector("textarea"));
      else box.hidden = true;
      break;
    }
    case "tool-apply": applyTool(); break;
    case "tbl-col-add": syncTable(); tbl.align.push("none"); tbl.rows.forEach(r => r.push("")); renderTableEditor(); break;
    case "tbl-col-del":
      if (tbl.align.length > 1){ syncTable(); tbl.align.pop(); tbl.rows.forEach(r => r.pop()); renderTableEditor(); }
      break;
    case "tbl-row-add": syncTable(); tbl.rows.push(tbl.align.map(() => "")); renderTableEditor(); break;
    case "tbl-row-del":
      if (tbl.rows.length > 2){ syncTable(); tbl.rows.pop(); renderTableEditor(); }
      break;
    case "tbl-align": {
      syncTable();
      const c = +el.dataset.c;
      tbl.align[c] = ALIGN_CYCLE[(ALIGN_CYCLE.indexOf(tbl.align[c]) + 1) % ALIGN_CYCLE.length];
      renderTableEditor(); break;
    }
    case "repeat-add": {
      const f = REPEAT_SPEC[el.dataset.key];
      document.querySelector(`[data-repeat="${CSS.escape(el.dataset.key)}"]`)
        ?.insertAdjacentHTML("beforeend", repeatRow(f, {}));
      break;
    }
    case "repeat-del": el.closest(".b-entry")?.remove(); break;
  }
});

document.addEventListener("input", ev => {
  if (ev.target.matches(".md-editor textarea")){
    clearTimeout(ev.target.__pv);
    ev.target.__pv = setTimeout(() => refreshPreview(ev.target), 220);
  }
  if (ev.target.id === "img-url" || ev.target.id === "img-w" || ev.target.id === "img-h"){
    const url = $("#img-url").value.trim();
    const w = $("#img-w").value.trim(), h = $("#img-h").value.trim();
    $("#img-preview").innerHTML = url
      ? md(`[${url}${w ? " W:" + w : ""}${h ? " H:" + h : ""}]`)
      : `<span class="tool-hint" style="margin:0">Предпросмотр появится здесь</span>`;
  }
  if (ev.target.id === "search-input"){
    state.search = ev.target.value;
    clearTimeout(window.__searchTimer);
    window.__searchTimer = setTimeout(renderGrid, 180);
  }
});
document.addEventListener("change", async ev => {
  if (ev.target.id === "system-select"){ state.system = ev.target.value; loadBase(); await renderGrid(); }
  if (ev.target.id === "json-upload") await uploadJson(ev.target);
  if (ev.target.id === "badge-mode"){
    state.badgeMode = ev.target.checked ? "stats" : "types";
    document.body.setAttribute("data-badge", state.badgeMode);
    state.filters = {};                 // чтобы не остался невидимый активный фильтр
    renderFilters();
    await renderGrid();
  }
});
$("#src-switch").addEventListener("click", async ev => {
  const b = ev.target.closest("button[data-src]"); if (!b) return;
  state.source = b.dataset.src;
  [...$("#src-switch").children].forEach(x => x.classList.toggle("active", x === b));
  await renderGrid();
});

async function uploadJson(input){
  if (!state.user){ input.value = ""; return toast("Авторизуйтесь для загрузки"); }
  const file = input.files[0]; if (!file) return;
  const c = catCfg();
  try {
    const list = JSON.parse(await file.text());
    if (!Array.isArray(list)) throw new Error("Ожидается массив [ {...} ]");
    const nick = localStorage.getItem("custom_nickname") || state.user.email.split("@")[0];
    for (const item of list){
      const id = `${c.customType}_${Date.now()}_${Math.floor(Math.random()*1000)}`;
      await setDoc(doc(db, COLL, id), {
        type:c.customType, data:item, isPrivate:false,
        creatorEmail:state.user.email, creator:nick, updatedAt:new Date().toISOString()
      });
    }
    toast(`Загружено записей: ${list.length}`);
    await loadCustom(true); await renderGrid();
  } catch(e){ console.error(e); toast("Ошибка формата файла"); }
  finally { input.value = ""; }
}

/* ============================================================
   15. СТАРТ
   ============================================================ */
renderPicks();

/* Диплинки: compendium.html#feats, #bestiary, #lore и т.д.
   Позволяет оставить карточки в navigation.html — просто поменяйте href. */
function catFromHash(){
  const h = location.hash.replace("#","");
  return CATS[h] ? h : "classes";
}
window.addEventListener("hashchange", () => {
  const id = catFromHash();
  if (id !== state.cat) setCategory(id);
});
const _setCategory = setCategory;
setCategory = async id => { await _setCategory(id); if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); };

setCategory(catFromHash());
</script>
