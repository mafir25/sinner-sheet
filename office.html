<!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDaFNBCW76UsBnziHoGveo7TcC11uAdmqs",
            authDomain: "projectmoonchar.firebaseapp.com",
            projectId: "projectmoonchar",
            storageBucket: "projectmoonchar.firebasestorage.app",
            messagingSenderId: "516028417887",
            appId: "1:516028417887:web:4c0404f653b09ecffb58ea"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let currentUser = null;
        let currentOfficeId = null;
        let isCreator = false;
        let questsDB = [];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('office-workspace').style.display = 'grid';
                loadUserOffices();
                loadQuestsDB();
            } else {
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('office-workspace').style.display = 'none';
            }
        });

        window.loginUser = async () => {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            if (!e || !p) return alert("Введите Email и Пароль");
            try {
                await signInWithEmailAndPassword(auth, e, p);
            } catch (err) {
                if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                    try {
                        await createUserWithEmailAndPassword(auth, e, p);
                        alert("Регистрация успешна!");
                    } catch (err2) { alert(err2.message); }
                } else { alert(err.message); }
            }
        };

        /* ИСПРАВЛЕНИЕ 1: Игнорируем клики внутри самого дропдауна, чтобы он не закрывался раньше времени */
        window.onclick = function(event) {
            if (!event.target.closest('.dropdown')) {
                const drops = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < drops.length; i++) {
                    if (drops[i].parentElement.classList.contains('active')) {
                        drops[i].parentElement.classList.remove('active');
                    }
                }
            }
        }

        async function loadUserOffices() {
            const listEl = document.getElementById('office-list');
            listEl.innerHTML = '<div style="padding: 10px; color: var(--text-dim); font-size: 0.8rem;">Загрузка...</div>';
            
            try {
                const q = query(collection(db, "offices"), where("members", "array-contains", currentUser.email));
                const querySnapshot = await getDocs(q);
                
                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    html += `<div class="dropdown-item" onclick="window.openOffice('${docSnap.id}')">${data.name}</div>`;
                });
                
                /* Добавлен event для надежности */
                html += `<div class="dropdown-item dropdown-create" onclick="window.createNewOffice(event)"><i class="fa-solid fa-plus"></i> СОЗДАТЬ ОФИС</div>`;
                listEl.innerHTML = html;
                
                if (!currentOfficeId && !querySnapshot.empty) {
                    window.openOffice(querySnapshot.docs[0].id);
                } else if (querySnapshot.empty) {
                    document.getElementById('office-name').value = "ВЫБЕРИТЕ ИЛИ СОЗДАЙТЕ ОФИС";
                }
            } catch (error) {
                console.error(error);
                listEl.innerHTML = '<div style="padding: 10px; color: var(--color-red);">Ошибка загрузки. Вероятно, блокировка правилами Firebase.</div>';
            }
        }

        /* ИСПРАВЛЕНИЕ 2: Блокировка всплытия клика, ручное закрытие меню и визуальный отклик */
        window.createNewOffice = async (e) => {
            if (e) e.stopPropagation(); 
            document.getElementById('office-dropdown').classList.remove('active'); 
            
            const nameInput = document.getElementById('office-name');
            nameInput.value = "СИСТЕМА СОЗДАЕТ ОФИС...";
            
            try {
                const newOfficeRef = doc(collection(db, "offices"));
                const newOfficeData = {
                    name: "НОВЫЙ ОФИС " + Math.floor(Math.random() * 1000),
                    creator: currentUser.email,
                    members: [currentUser.email],
                    logoUrl: "",
                    characters: [],
                    news: []
                };
                await setDoc(newOfficeRef, newOfficeData);
                await loadUserOffices();
                window.openOffice(newOfficeRef.id);
            } catch (err) {
                nameInput.value = "ОШИБКА ДОСТУПА В БАЗУ";
                alert("Ошибка при создании офиса! Убедитесь, что в Firestore Rules разрешена запись (allow read, write: if request.auth != null;).");
                console.error(err);
            }
        };

        window.openOffice = async (id) => {
            document.getElementById('office-dropdown').classList.remove('active'); // Закрываем меню
            currentOfficeId = id;
            try {
                const docSnap = await getDoc(doc(db, "offices", id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    isCreator = (data.creator === currentUser.email);
                    
                    const creatorEls = document.querySelectorAll('.creator-only');
                    creatorEls.forEach(el => el.style.display = isCreator ? 'block' : 'none');
                    
                    const nameInput = document.getElementById('office-name');
                    nameInput.value = data.name;
                    nameInput.readOnly = !isCreator;
                    
                    const logoArea = document.getElementById('office-logo');
                    if (data.logoUrl) logoArea.style.backgroundImage = `url('${data.logoUrl}')`;
                    else logoArea.style.backgroundImage = 'none';
                    if (isCreator) logoArea.classList.add('creator'); else logoArea.classList.remove('creator');

                    renderCharacters(data.characters || []);
                    renderNews(data.news || []);
                }
            } catch(e) { console.error(e); }
        };

        window.saveOfficeInfo = async () => {
            if (!currentOfficeId || !isCreator) return;
            const newName = document.getElementById('office-name').value;
            try {
                await updateDoc(doc(db, "offices", currentOfficeId), { name: newName });
                loadUserOffices();
            } catch (err) {
                alert("Ошибка сохранения имени.");
            }
        };

        window.triggerLogoUpload = () => {
            if (isCreator) document.getElementById('logo-upload').click();
        };

        window.uploadLogo = async (e) => {
            const file = e.target.files[0];
            if (!file || !currentOfficeId) return;
            
            document.getElementById('office-logo').style.backgroundImage = 'none';
            document.getElementById('office-logo').innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="color:var(--color-cyan);"></i>';

            try {
                const storageRef = ref(storage, `offices/${currentOfficeId}/logo_${Date.now()}`);
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);
                
                await updateDoc(doc(db, "offices", currentOfficeId), { logoUrl: url });
                document.getElementById('office-logo').innerHTML = '';
                document.getElementById('office-logo').style.backgroundImage = `url('${url}')`;
            } catch (err) {
                console.error(err);
                alert("Ошибка загрузки изображения в Storage.");
                document.getElementById('office-logo').innerHTML = '';
            }
            e.target.value = '';
        };

        window.addMember = async () => {
            const input = document.getElementById('new-member-email');
            const email = input.value.trim();
            if (!email || !currentOfficeId || !isCreator) return;
            
            try {
                await updateDoc(doc(db, "offices", currentOfficeId), {
                    members: arrayUnion(email)
                });
                alert(`Агент ${email} добавлен в Офис!`);
                input.value = '';
            } catch (err) { alert("Ошибка добавления пользователя."); console.error(err); }
        };

        window.uploadCharacter = (e) => {
            const file = e.target.files[0];
            if (!file || !currentOfficeId) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const preset = JSON.parse(event.target.result);
                    if (!preset.characterName) throw new Error();
                    
                    const charObj = {
                        id: Date.now().toString(),
                        name: preset.characterName,
                        race: preset.race || 'Неизвестно',
                        className: preset.className || 'Фиксер',
                        desc: `Раса: ${preset.race}\nКласс: ${preset.className}\nЧерты: ${(preset.feats || []).join(', ')}`,
                        rawJson: preset
                    };
                    
                    await updateDoc(doc(db, "offices", currentOfficeId), {
                        characters: arrayUnion(charObj)
                    });
                    window.openOffice(currentOfficeId);
                } catch (err) { alert("Ошибка чтения JSON пресета."); }
            };
            reader.readAsText(file);
            e.target.value = '';
        };

        function renderCharacters(chars) {
            const container = document.getElementById('characters-container');
            if (chars.length === 0) {
                container.innerHTML = '<div class="tech-text" style="color: var(--text-dim);">Досье отсутствуют.</div>';
                return;
            }
            
            let html = '';
            chars.forEach(c => {
                const delBtn = isCreator ? `<i class="fa-solid fa-trash btn-trash" style="position:relative; opacity:1;" onclick="window.deleteCharacter(event, '${c.id}')"></i>` : '';
                html += `
                    <div class="preset-card">
                        <div class="preset-header" onclick="this.parentElement.classList.toggle('expanded')">
                            <span class="preset-name">${c.name}</span>
                            <div style="display:flex; gap: 8px; align-items:center;">
                                <i class="fa-solid fa-download btn-trash" style="position:relative; opacity:1; color: var(--color-cyan);" title="Скачать пресет" onclick="window.downloadPreset(event, '${c.id}')"></i>
                                ${delBtn}
                            </div>
                        </div>
                        <div class="preset-desc">${c.desc}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
            window._currentChars = chars; 
        }

        window.deleteCharacter = async (e, id) => {
            e.stopPropagation();
            if (!confirm("Удалить досье из Офиса?")) return;
            const charObj = window._currentChars.find(c => c.id === id);
            if(charObj) {
                try {
                    await updateDoc(doc(db, "offices", currentOfficeId), {
                        characters: arrayRemove(charObj)
                    });
                    window.openOffice(currentOfficeId);
                } catch(err) { alert("Ошибка удаления."); }
            }
        };

        window.downloadPreset = (e, id) => {
            e.stopPropagation();
            const charObj = window._currentChars.find(c => c.id === id);
            if (charObj && charObj.rawJson) {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(charObj.rawJson, null, 2));
                const dl = document.createElement('a');
                dl.setAttribute("href", dataStr);
                dl.setAttribute("download", charObj.name + "_preset.json");
                document.body.appendChild(dl);
                dl.click();
                dl.remove();
            }
        };

        window.addNews = async () => {
            const input = document.getElementById('news-input');
            const text = input.value.trim();
            if (!text || !currentOfficeId) return;
            
            const newsObj = {
                id: Date.now().toString(),
                date: new Date().toLocaleDateString('ru-RU'),
                text: text
            };
            
            try {
                await updateDoc(doc(db, "offices", currentOfficeId), {
                    news: arrayUnion(newsObj)
                });
                input.value = '';
                window.openOffice(currentOfficeId);
            } catch(err) { alert("Ошибка публикации."); }
        };

        function renderNews(newsArr) {
            const container = document.getElementById('news-container');
            if (newsArr.length === 0) {
                container.innerHTML = '<div class="tech-text" style="color: var(--text-dim);">Событий не зафиксировано.</div>';
                return;
            }
            
            const sorted = [...newsArr].sort((a,b) => parseInt(b.id) - parseInt(a.id));
            
            let html = '';
            sorted.forEach(n => {
                const delBtn = isCreator ? `<button class="btn-trash" onclick="window.deleteNews('${n.id}')"><i class="fa-solid fa-trash"></i></button>` : '';
                html += `
                    <div class="news-item">
                        ${delBtn}
                        <div class="news-date">${n.date}</div>
                        <div class="news-text">${n.text}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
            window._currentNews = newsArr;
        }

        window.deleteNews = async (id) => {
            if (!confirm("Удалить сводку?")) return;
            const nObj = window._currentNews.find(n => n.id === id);
            if(nObj) {
                try {
                    await updateDoc(doc(db, "offices", currentOfficeId), {
                        news: arrayRemove(nObj)
                    });
                    window.openOffice(currentOfficeId);
                } catch (err) { alert("Ошибка удаления новости."); }
            }
        };

        const gradeMapping = {
            1: "ЦВЕТНОЙ", 2: "1 РАНГ", 3: "2 РАНГ", 4: "3 РАНГ", 5: "4 РАНГ", 
            6: "5 РАНГ", 7: "6 РАНГ", 8: "7 РАНГ", 9: "8 РАНГ", 10: "9 РАНГ"
        };

        async function loadQuestsDB() {
            try {
                const res = await fetch('quests.json');
                if (res.ok) questsDB = await res.json();
            } catch(e) { console.error("Quests JSON not found", e); }
            
            renderGradeAccordions();
        }

        function renderGradeAccordions() {
            const container = document.getElementById('grades-container');
            let html = '';
            
            for (let i = 1; i <= 10; i++) {
                html += `
                    <div class="grade-block" id="grade-block-${i}">
                        <div class="grade-header" onclick="window.toggleGrade(${i})">
                            <span>КОНТРАКТЫ: ${gradeMapping[i]}</span>
                            <div style="display: flex; align-items: center;">
                                <div class="header-icons" id="header-icons-${i}"></div>
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>
                        <div class="grade-content" id="grade-content-${i}"></div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        window.toggleGrade = (gradeNum) => {
            const block = document.getElementById(`grade-block-${gradeNum}`);
            const content = document.getElementById(`grade-content-${gradeNum}`);
            const headerIconsContainer = document.getElementById(`header-icons-${gradeNum}`);
            
            if (block.classList.contains('expanded')) {
                block.classList.remove('expanded');
                return;
            }
            
            document.querySelectorAll('.grade-block').forEach(b => b.classList.remove('expanded'));
            
            const filtered = questsDB.filter(q => parseInt(q.grade) === gradeNum);
            
            if (filtered.length === 0) {
                content.innerHTML = '<div style="padding:16px; color:var(--text-dim); font-family:Oswald;">НЕТ ДОСТУПНЫХ КОНТРАКТОВ ДАННОГО РАНГА.</div>';
                headerIconsContainer.innerHTML = '';
            } else {
                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }
                const selected = filtered.slice(0, 5);
                
                let qHtml = '';
                let uniqueIcons = new Set();

                selected.forEach(q => {
                    let iconHtml = '';
                    if (q.Icon && q.Icon.trim() !== '') {
                        iconHtml = `&nbsp;&nbsp;&nbsp;<img src="${q.Icon}" class="quest-icon" onerror="this.style.display='none'">`;
                        uniqueIcons.add(q.Icon);
                    }
                    qHtml += `
                        <div class="quest-item" onclick="this.classList.toggle('open')">
                            <div class="quest-title">${q.name}${iconHtml}</div>
                            <div class="quest-desc">${q.desc}</div>
                        </div>
                    `;
                });
                
                content.innerHTML = qHtml;

                let hIconsHtml = '';
                uniqueIcons.forEach(iconSrc => {
                    hIconsHtml += `<img src="${iconSrc}" class="quest-icon" style="margin-left:0;" onerror="this.style.display='none'">`;
                });
                headerIconsContainer.innerHTML = hIconsHtml;
            }
            
            block.classList.add('expanded');
        };
    </script>
