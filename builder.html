<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Персонажа / Character Builder</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:ital,wght@0,300;1,300;1,700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #070707; --bg-panel: #000000; --accent-primary: #D9772F; --accent-muted: #8B5A2B;
            --color-cyan: #45B3CB; --color-red: #C7243A; --color-yellow: #F1C40F;
            --text-main: #E0D8C8; --text-dim: #696969;
            --border-width: 1px; --chamfer: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif;
            min-height: 100vh; padding: 60px 20px 40px 20px; display: flex; flex-direction: column; align-items: center;
            background-image: linear-gradient(rgba(7,7,7,0.8), rgba(7,7,7,0.8)), repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .oswald { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .tech-text { font-family: 'Inter', sans-serif; color: var(--accent-primary); font-size: 0.8rem; }

        /* Навигация */
        .top-nav-btn { position: fixed; top: 10px; left: 20px; padding: 6px 12px; font-size: 0.8rem; border-color: var(--color-cyan); color: var(--color-cyan); font-family: 'Oswald', sans-serif; z-index: 100; background: var(--bg-main); text-decoration: none; display: flex; align-items: center; gap: 6px; border: 1px solid var(--color-cyan); cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .top-nav-btn:hover { background-color: var(--color-cyan); color: #000; }
        
        .nav-btn-2 { left: 180px; border-color: var(--color-yellow); color: var(--color-yellow); }
        .nav-btn-2:hover { background-color: var(--color-yellow); color: #000; }
        
        .nav-btn-3 { left: 340px; border-color: var(--color-red); color: var(--color-red); }
        .nav-btn-3:hover { background-color: var(--color-red); color: #000; }

        .header-bar { width: 100%; max-width: 1400px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--accent-muted); padding-bottom: 10px; margin-top: 10px; }
        .header-title { color: var(--accent-primary); font-size: 1.5rem; letter-spacing: 2px; text-align: center; }

        /* Лейаут Конструктора */
        .builder-container { display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; width: 100%; max-width: 1400px; align-items: start; }
        
        /* Панели */
        .panel-outer { background-color: var(--accent-primary); padding: var(--border-width); position: relative; display: flex; flex-direction: column; }
        .panel-inner { background-color: var(--bg-panel); padding: 20px; height: 100%; display: flex; flex-direction: column; }
        .cut-tl { clip-path: polygon(var(--chamfer) 0, 100% 0, 100% 100%, 0 100%, 0 var(--chamfer)); }
        .hazard-tape { height: 6px; background: repeating-linear-gradient(45deg, #000 0px, #000 10px, var(--accent-muted) 10px, var(--accent-muted) 20px); border-bottom: 1px solid var(--accent-primary); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-family: 'Oswald', sans-serif; color: var(--color-cyan); margin-bottom: 6px; font-size: 1.1rem; }
        
        .cloud-input, .cloud-select { width: 100%; background: #111; border: 1px solid #333; color: var(--text-main); padding: 10px; outline: none; font-family: 'Inter'; font-size: 0.95rem; }
        .cloud-input:focus, .cloud-select:focus { border-color: var(--color-cyan); }
        
        /* Загрузка файлов */
        .file-upload-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .file-upload-btn { flex: 1; background: transparent; border: 1px dashed var(--text-dim); color: var(--text-dim); padding: 8px; font-family: 'Oswald'; font-size: 0.8rem; cursor: pointer; text-align: center; transition: 0.2s; position: relative; }
        .file-upload-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .file-upload-btn input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        /* Список черт */
        .feats-list-container { max-height: 300px; overflow-y: auto; border: 1px solid #333; background: #0a0a0a; padding: 10px; margin-top: 8px; }
        .feats-list-container::-webkit-scrollbar { width: 6px; }
        .feats-list-container::-webkit-scrollbar-thumb { background: var(--accent-primary); }
        
        .feat-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .feat-item:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        .feat-item input { margin-top: 4px; accent-color: var(--color-cyan); cursor: pointer; }
        .feat-item-text { font-size: 0.85rem; color: var(--text-dim); cursor: pointer; }
        .feat-item-title { color: var(--text-main); font-weight: bold; font-family: 'Oswald'; font-size: 0.95rem; display: block; }
        
        .search-feats { margin-bottom: 8px; }

        /* Вывод персонажа */
        .output-panel { position: sticky; top: 60px; max-height: calc(100vh - 80px); overflow-y: auto; }
        .output-panel::-webkit-scrollbar { width: 6px; }
        .output-panel::-webkit-scrollbar-thumb { background: var(--color-cyan); }
        
        .output-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--color-cyan); padding-bottom: 10px; margin-bottom: 20px; }
        .char-name-display { font-size: 2rem; color: var(--text-main); font-family: 'Oswald'; text-transform: uppercase; }
        .char-meta-display { font-size: 1rem; color: var(--color-cyan); font-family: 'Oswald'; }
        
        .block-title { font-size: 1.4rem; color: var(--accent-primary); border-bottom: 1px solid #333; margin-top: 24px; margin-bottom: 12px; padding-bottom: 4px; font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        
        .trait-entry { margin-bottom: 16px; border-left: 2px solid var(--text-dim); padding-left: 12px; }
        .trait-name { font-size: 1.1rem; color: var(--color-yellow); font-family: 'Oswald', sans-serif; margin-bottom: 4px; }
        .trait-req { color: var(--color-red); font-size: 0.8rem; font-family: 'Oswald', sans-serif; text-transform: uppercase; margin-bottom: 4px; }
        .trait-desc { font-size: 0.9rem; color: var(--text-main); line-height: 1.5; white-space: pre-wrap; }

        .copy-btn { background: transparent; border: 1px solid var(--color-cyan); color: var(--color-cyan); padding: 6px 12px; font-family: 'Oswald'; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .copy-btn:hover { background: var(--color-cyan); color: #000; }

        /* Адаптивность */
        @media (max-width: 900px) {
            .builder-container { grid-template-columns: 1fr; }
            .output-panel { position: static; max-height: none; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="top-nav-btn"><i class="fa-solid fa-house"></i> ХАБ</a>
    <a href="grimoire.html" class="top-nav-btn nav-btn-2"><i class="fa-solid fa-book-journal-whills"></i> ГРИМУАР</a>
    <a href="feats.html" class="top-nav-btn nav-btn-3"><i class="fa-solid fa-dumbbell"></i> БАЗА ЧЕРТ</a>

    <div class="header-bar">
        <div class="header-title oswald">СИСТЕМА СБОРКИ ПЕРСОНАЖА (CHARACTER BUILDER)</div>
    </div>

    <div class="builder-container">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ: ВВОД ДАННЫХ -->
        <div class="panel-outer cut-tl">
            <div class="hazard-tape"></div>
            <div class="panel-inner cut-tl" style="border-top: none;">
                
                <div class="file-upload-row">
                    <div class="file-upload-btn">
                        <i class="fa-solid fa-upload"></i> ЗАГРУЗИТЬ КАСТОМНЫЙ КЛАСС (JSON)
                        <input type="file" accept=".json" onchange="window.loadCustomClass(event)">
                    </div>
                    <div class="file-upload-btn">
                        <i class="fa-solid fa-upload"></i> ЗАГРУЗИТЬ КАСТОМНУЮ ЧЕРТУ (JSON)
                        <input type="file" accept=".json" onchange="window.loadCustomFeat(event)">
                    </div>
                </div>

                <div class="form-group">
                    <label>ИМЯ ПЕРСОНАЖА</label>
                    <input type="text" id="char-name" class="cloud-input" placeholder="Введите имя..." oninput="window.updateOutput()">
                </div>

                <div class="form-group">
                    <label>РАСА</label>
                    <select id="char-race" class="cloud-select" onchange="window.updateOutput()">
                        <option value="">-- Выберите Расу --</option>
                        <option value="human">Человек (Human)</option>
                        <option value="bloodfiend">Кровавый Демон (Bloodfiend)</option>
                        <option value="half_distortion">Полу-Искажение (Half-Distortion)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>АРХЕТИП (КЛАСС)</label>
                    <select id="char-class" class="cloud-select" onchange="window.updateOutput()">
                        <option value="">-- Базовый Фиксер (Без Архетипа) --</option>
                        <!-- Подгружается из JSON -->
                    </select>
                </div>

                <div class="form-group">
                    <label>ЧЕРТЫ (FEATS)</label>
                    <input type="text" id="feat-search" class="cloud-input search-feats" placeholder="Поиск черты..." onkeyup="window.filterFeatChecklist()">
                    <div class="feats-list-container" id="feats-checklist">
                        <!-- Подгружается из JSON -->
                    </div>
                </div>

            </div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ: ВЫВОД ПЕРСОНАЖА -->
        <div class="panel-outer cut-tl output-panel">
            <div class="hazard-tape" style="background: repeating-linear-gradient(45deg, #000 0px, #000 10px, var(--color-cyan) 10px, var(--color-cyan) 20px); border-bottom: 1px solid var(--color-cyan);"></div>
            <div class="panel-inner cut-tl" style="border-top: none;" id="output-area">
                
                <div class="output-header">
                    <div>
                        <div class="char-name-display" id="out-name">БЕЗ ИМЕНИ</div>
                        <div class="char-meta-display" id="out-meta">Раса не выбрана | Фиксер</div>
                    </div>
                    <button class="copy-btn" onclick="window.copyCharacter()"><i class="fa-regular fa-copy"></i> КОПИРОВАТЬ ВСЁ</button>
                </div>

                <div id="out-content">
                    <!-- Сюда генерируются блоки -->
                    <div style="color: var(--text-dim); text-align: center; margin-top: 50px; font-family: 'Oswald'; font-size: 1.2rem;">
                        ЗАПОЛНИТЕ ДАННЫЕ В ЛЕВОЙ ПАНЕЛИ ДЛЯ ГЕНЕРАЦИИ ДОСЬЕ
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        // Базы Данных
        window.dbClasses = [];
        window.dbFeats = [];

        // Базовые данные Фиксера
        const fixerBaseTraits = [
            { name: "Хиты (Hit Points)", desc: "Кость хитов: 1d10 за уровень.\nХиты на 1-м уровне: 10 + мод. ТЕЛ.\nНа следующих: 1d10 (или 6) + мод. ТЕЛ." },
            { name: "Владения (Proficiencies)", desc: "Броня: Легкая, Средняя, Щиты.\nОружие: Простое, Боевое, Огнестрельное.\nСпасброски: Мудрость, Ловкость или Телосложение И Интеллект, Сила или Харизма.\nНавыки: Выберите 3 (Атлетика, Акробатика, Расследование, Выживание, Скрытность, Убеждение, Проницательность, Медицина)." },
            { name: "Ранг Фиксера (Fixer Grade)", desc: "По мере выполнения контрактов ранг повышается от 9 до 1 (Цветной). Ассоциация Хана следит за рейтингами." },
            { name: "Униформа и Мастерские", desc: "Униформа Принадлежности (или артефакт). Доступ к мастерским для улучшения снаряжения. Количество слотов зависит от уровня." },
            { name: "Сложность способностей", desc: "СЛ Фиксера = 8 + ПБ + модификатор СИЛ/ЛОВ.\nМод. Атаки = ПБ + модификатор СИЛ/ЛОВ." },
            { name: "Боевой стиль (Fighting Style)", desc: "На 2-м уровне выберите стиль боя (Меткий стрелок, Слепой бой, Дуэлянт, Парное оружие и т.д.). Второй стиль на 10-м уровне." },
            { name: "Аномальная способность (Abnormal Ability)", desc: "На 2-м уровне выберите особенность (Сильный, Быстрый, Прочный, Умный, Мудрый, Потрясающий). Улучшается на 7 и 14 уровнях." },
            { name: "Свет (Light)", desc: "Запас Света = Уровень Фиксера + ПБ + мод. ИНТ/МУД/ХАР. Изучите техники Света (Устрашающая атака, Рикошет, Усиление натиска и т.д.)." },
            { name: "Столкновения (Clashing)", desc: "Реакцией за 2 Света вступите в Столкновение (Контрудар, Смягчение, Затягивание). Бросок урона против броска урона врага." },
            { name: "Дополнительная атака", desc: "На 5-м уровне (2 атаки), на 11-м уровне (3 атаки)." },
            { name: "Личностное развитие", desc: "На 9 и 15 уровнях возьмите любую черту Фиксера, требованиям которой соответствуете." },
            { name: "Аморальный разум", desc: "На 9-м уровне: Иммунитет к стрессу от жестокости. Уклонение (Evasion) для стата Аномальной Способности." },
            { name: "Никогда не окружен", desc: "На 15-м уровне: Иммунитет к заходу во фланг (flanking)." },
            { name: "Признание", desc: "На 18-м уровне: Враги, узнавшие вас (СЛ 10 История), получают помеху на спасы от ваших умений." },
            { name: "Существо Света", desc: "На 20-м уровне: Аномальный стат и его макс. увеличены на 2. Форму нельзя изменить против воли." }
        ];

        // Данные Рас
        const raceData = {
            "human": {
                name: "Человек (Human)",
                traits: [
                    { name: "Характеристики", desc: "Увеличьте значение каждой характеристики на 1." },
                    { name: "Возраст и Мировоззрение", desc: "Люди достигают совершеннолетия к 20 годам и живут меньше века. Не имеют склонности к определенному мировоззрению." },
                    { name: "Размер и Скорость", desc: "Размер: Средний (Medium). Базовая скорость ходьбы: 30 футов." },
                    { name: "Языки", desc: "Общий язык и один дополнительный на ваш выбор." }
                ]
            },
            "bloodfiend": {
                name: "Кровавый Демон (Bloodfiend)",
                traits: [
                    { name: "Физиология", desc: "Бледная кожа, красные глаза. Бессмертны от старости. Склонны к Законопослушному Злому мировоззрению (Lawful Evil). Размер Средний." },
                    { name: "Характеристики и Скорость", desc: "+1 к Силе, Ловкости и Телосложению. Скорость: 35 футов." },
                    { name: "Мощное телосложение", desc: "Значительно сильнее людей. Вы получаете черту Powerful Build." },
                    { name: "Клыки (Fangs)", desc: "Ваш укус — природное оружие, наносящее 1d4 + модификатор СИЛ или ЛОВ колющего урона." },
                    { name: "Жажда крови (Bloodthirst)", desc: "Вам необходимо потреблять 12 унций человеческой крови в день для когнитивной стабильности. Если не пить 3 дня — спасбросок Мудрости от краткосрочного безумия. Через неделю — от долгосрочного. Кровь животных заменяет человеческую по курсу 48 к 12 унциям, но спасает максимум на неделю. Семья более 10 сородичей снимает помеху со спасбросков безумия." },
                    { name: "Регенерация", desc: "Бонусным действием можно тратить Кости Хитов для лечения. Макс. за раз: половина модификатора ТЕЛ (округленно вниз) + ПБ. Не работает при голоде. За каждую потраченную кость нужно выпить 1 доп. унцию крови в этот день." },
                    { name: "Ранг сородича (Kindred Ranking)", desc: "Вы подчиняетесь сородичу, который вас обратил (ваш ранг на 1 ниже его). Приказы высших сородичей — закон (провал спасброска МУД означает Испуг). Нанесение вреда высшему сородичу мгновенно вызывает Испуг и Оглушение, если только вы не страдаете от безумия из-за голода по его вине. На 17-м уровне вы можете обратить до 2-х людей." },
                    { name: "Языки", desc: "Общий язык и один дополнительный на ваш выбор." }
                ]
            },
            "half_distortion": {
                name: "Полу-Искажение (Half-Distortion)",
                traits: [
                    { name: "Физиология", desc: "Сохраняют черты оригинальной расы, но имеют метафизические признаки (обычно отражающие травму или грех). Увеличенный срок жизни (до х2 от оригинала). Размер оригинальной расы." },
                    { name: "Характеристики и Скорость", desc: "+1 к Силе ИЛИ Ловкости, +1 к Телосложению, +1 к Мудрости. Скорость: 30 футов." },
                    { name: "Искаженный (Distorted)", desc: "Выберите 1 расовую черту вашей оригинальной расы (если это Человек — используйте черту Вариантного Человека). Этот выбор нельзя изменить." },
                    { name: "Искушение (Temptation)", desc: "Вы поддались искушению Кармен. Вы получаете черту Сродство с Грехом (Sin Affinity) для греха, из-за которого исказились. Однако вы получаете уязвимость (х2 урон) к противоположному Греху (тому, от чего вы пытались сбежать)." },
                    { name: "Аномалия (Anomaly)", desc: "Вы чувствуете присутствие других искажений или аномалий. Преимущество на проверки Восприятия и Расследования для их идентификации." },
                    { name: "Языки", desc: "Общий язык и один дополнительный на ваш выбор." }
                ]
            }
        };

        // Загрузка стандартных баз при старте
        async function loadDatabases() {
            try {
                const resClass = await fetch('classes.json');
                if (resClass.ok) {
                    window.dbClasses = await resClass.json();
                    window.dbClasses.sort((a, b) => a.No - b.No);
                }
                const resFeats = await fetch('feats.json');
                if (resFeats.ok) {
                    window.dbFeats = await resFeats.json();
                }
                renderDropdowns();
            } catch (e) {
                console.error("Ошибка загрузки стандартных баз:", e);
            }
        }

        // Отрисовка списков выбора
        function renderDropdowns() {
            // Классы
            const classSelect = document.getElementById('char-class');
            const currentClass = classSelect.value;
            let classHtml = '<option value="">-- Базовый Фиксер (Без Архетипа) --</option>';
            window.dbClasses.forEach((cls, i) => {
                classHtml += `<option value="${i}">[${cls.No}] ${cls.Name}</option>`;
            });
            classSelect.innerHTML = classHtml;
            classSelect.value = currentClass; // восстанавливаем выбор если был

            // Черты
            const featsContainer = document.getElementById('feats-checklist');
            let featsHtml = '';
            window.dbFeats.forEach((feat, i) => {
                const safeName = feat.Name.replace(/"/g, '&quot;');
                featsHtml += `
                    <label class="feat-item">
                        <input type="checkbox" value="${i}" class="feat-checkbox" onchange="window.updateOutput()">
                        <div class="feat-item-text">
                            <span class="feat-item-title">${safeName}</span>
                            ${feat.Need ? `<span style="color: var(--color-red); font-size: 0.75rem;">Требование: ${feat.Need}</span>` : ''}
                        </div>
                    </label>
                `;
            });
            // Сохраняем состояние чекбоксов если нужно, но пока просто перезаписываем
            featsContainer.innerHTML = featsHtml;
        }

        // Загрузка кастомного класса
        window.loadCustomClass = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (Array.isArray(data)) {
                        window.dbClasses = window.dbClasses.concat(data);
                    } else {
                        window.dbClasses.push(data);
                    }
                    renderDropdowns();
                    alert("Кастомный класс успешно загружен!");
                } catch (err) {
                    alert("Ошибка чтения JSON файла.");
                }
            };
            reader.readAsText(file);
        };

        // Загрузка кастомной черты
        window.loadCustomFeat = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (Array.isArray(data)) {
                        window.dbFeats = window.dbFeats.concat(data);
                    } else {
                        window.dbFeats.push(data);
                    }
                    renderDropdowns();
                    alert("Кастомная черта успешно загружена!");
                } catch (err) {
                    alert("Ошибка чтения JSON файла.");
                }
            };
            reader.readAsText(file);
        };

        // Фильтрация списка черт
        window.filterFeatChecklist = () => {
            const query = document.getElementById('feat-search').value.toLowerCase();
            const items = document.querySelectorAll('.feat-item');
            items.forEach(item => {
                const title = item.querySelector('.feat-item-title').textContent.toLowerCase();
                if (title.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        };

        // Генератор HTML для блока таланта/черты
        function createOutputBlock(title, desc, req = null, color = 'var(--color-yellow)', subtitle = null) {
            let reqHtml = req ? `<div class="trait-req">ТРЕБОВАНИЯ: ${req}</div>` : '';
            let subHtml = subtitle ? `<div class="tech-text" style="margin-bottom:4px;">${subtitle}</div>` : '';
            return `
                <div class="trait-entry" style="border-left-color: ${color};">
                    <div class="trait-name" style="color: ${color};">${title}</div>
                    ${subHtml}
                    ${reqHtml}
                    <div class="trait-desc">${desc}</div>
                </div>
            `;
        }

        // Обновление правой панели
        window.updateOutput = () => {
            const name = document.getElementById('char-name').value || "БЕЗ ИМЕНИ";
            const raceKey = document.getElementById('char-race').value;
            const classIndex = document.getElementById('char-class').value;
            
            const selectedFeatsChecks = document.querySelectorAll('.feat-checkbox:checked');
            
            // Настройка шапки
            document.getElementById('out-name').textContent = name;
            let metaString = (raceKey ? raceData[raceKey].name : "Раса не выбрана") + " | Фиксер";
            
            let archetype = null;
            if (classIndex !== "") {
                archetype = window.dbClasses[classIndex];
                metaString += ` / ${archetype.Name}`;
            }
            document.getElementById('out-meta').textContent = metaString;

            let outputHtml = '';

            // 1. РАСА
            if (raceKey) {
                outputHtml += `<div class="block-title" style="color: var(--color-red); border-color: var(--color-red);">Особенности Расы: ${raceData[raceKey].name}</div>`;
                raceData[raceKey].traits.forEach(t => {
                    outputHtml += createOutputBlock(t.name, t.desc, null, 'var(--color-red)');
                });
            }

            // 2. БАЗОВЫЙ КЛАСС (FIXER)
            outputHtml += `<div class="block-title" style="color: var(--color-cyan); border-color: var(--color-cyan);">Базовый Класс: Фиксер</div>`;
            fixerBaseTraits.forEach(t => {
                outputHtml += createOutputBlock(t.name, t.desc, null, 'var(--color-cyan)');
            });

            // 3. АРХЕТИП
            if (archetype && archetype.Talents) {
                outputHtml += `<div class="block-title" style="color: var(--accent-primary); border-color: var(--accent-primary);">Архетип: ${archetype.Name}</div>`;
                archetype.Talents.forEach(t => {
                    const tColor = t.Color || t.color || 'var(--accent-primary)';
                    outputHtml += createOutputBlock(t.name, t.desc, null, tColor, `Уровень: ${t.level}`);
                });
            }

            // 4. ЧЕРТЫ
            if (selectedFeatsChecks.length > 0) {
                outputHtml += `<div class="block-title" style="color: var(--color-yellow); border-color: var(--color-yellow);">Выбранные Черты</div>`;
                selectedFeatsChecks.forEach(check => {
                    const feat = window.dbFeats[check.value];
                    if(feat) {
                        let baseStr = feat.Base ? feat.Base.join(', ') : '';
                        outputHtml += createOutputBlock(feat.Name, feat.desc, feat.Need, 'var(--color-yellow)', baseStr ? `Категория: ${baseStr}` : null);
                    }
                });
            }

            if (outputHtml === '') {
                outputHtml = `<div style="color: var(--text-dim); text-align: center; margin-top: 50px; font-family: 'Oswald'; font-size: 1.2rem;">ЗАПОЛНИТЕ ДАННЫЕ В ЛЕВОЙ ПАНЕЛИ ДЛЯ ГЕНЕРАЦИИ ДОСЬЕ</div>`;
            }

            document.getElementById('out-content').innerHTML = outputHtml;
        };

        // Копирование всего текста
        window.copyCharacter = () => {
            const outContent = document.getElementById('output-area');
            const textToCopy = outContent.innerText; // Берет весь отрендеренный текст как есть
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("Досье скопировано в буфер обмена!");
            }).catch(err => {
                console.error('Ошибка копирования:', err);
            });
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadDatabases();
        });
    </script>
</body>
</html>
