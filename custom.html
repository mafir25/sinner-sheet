<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База Пользователей / Custom Compendium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:ital,wght@0,300;1,300;1,700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Подключение Markdown парсера -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-main: #070707; --bg-panel: #000000; 
            --accent-primary: #45B3CB; 
            --color-red: #C7243A; --color-cyan: #45B3CB; --color-yellow: #F1C40F;
            --text-main: #E0D8C8; --text-dim: #696969;
            --border-width: 1px; --chamfer: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif;
            min-height: 100vh; padding: 80px 20px 40px 20px; display: flex; flex-direction: column; align-items: center;
            background-image: linear-gradient(rgba(7,7,7,0.8), rgba(7,7,7,0.8)), repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
        }

        h1, h2, h3, h4, .oswald { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .tech-text { font-family: 'Inter', sans-serif; color: var(--text-dim); font-size: 0.8rem; }
        .lore-text { font-family: 'Merriweather', serif; font-style: italic; color: var(--text-dim); font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap;}

        /* Навигация */
        .top-nav-btn { position: fixed; top: 10px; left: 20px; padding: 6px 12px; font-size: 0.8rem; border: 1px solid var(--accent-primary); color: var(--accent-primary); font-family: 'Oswald'; z-index: 100; background: var(--bg-main); text-decoration: none; display: flex; align-items: center; gap: 6px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .top-nav-btn:hover { background-color: var(--accent-primary); color: #000; }

        .auth-bar { position: fixed; top: 10px; right: 20px; z-index: 100; display: flex; gap: 8px; align-items: center;}
        .auth-btn { padding: 6px 12px; font-size: 0.8rem; border: 1px solid var(--text-dim); color: var(--text-dim); font-family: 'Oswald'; background: var(--bg-main); cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .auth-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

        /* Режимы */
        .mode-switcher { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; width: 100%; max-width: 1200px;}
        .mode-btn { padding: 8px 16px; border: 1px solid #333; background: rgba(0,0,0,0.5); color: var(--text-dim); font-family: 'Oswald'; font-size: 1rem; cursor: pointer; transition: 0.2s; text-transform: uppercase;}
        .mode-btn:hover { border-color: var(--text-main); color: var(--text-main); }
        .mode-btn.active { border-color: var(--accent-primary); color: var(--bg-main); background-color: var(--accent-primary); }

        /* Заголовок страницы */
        .header-bar { width: 100%; max-width: 1200px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--accent-primary); padding-bottom: 10px; }
        .header-title { color: var(--accent-primary); font-size: 2rem; letter-spacing: 2px; text-align: center; }

        .action-bar { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; flex-wrap: wrap;}
        .action-btn { flex: 1; min-width: 200px; padding: 10px; font-size: 0.9rem; font-family: 'Oswald'; cursor: pointer; border: 1px solid var(--accent-primary); color: var(--accent-primary); background: transparent; text-transform: uppercase; transition: 0.2s; text-align: center;}
        .action-btn:hover { background: var(--accent-primary); color: #000; }

        /* ФИЛЬТРЫ И ПОИСК */
        .filters-section { width: 100%; max-width: 1200px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
        .search-wrapper { background-color: #222; padding: var(--border-width); transition: background-color 0.2s; }
        .search-wrapper:focus-within { background-color: var(--accent-primary); }
        .search-inner { background: rgba(0,0,0,0.7); padding: 0; display: flex; align-items: center; flex-direction: row; }
        .search-icon { padding-left: 14px; font-size: 0.9rem; color: var(--text-dim); }
        .search-input { width: 100%; background: transparent; border: none; color: var(--text-main); padding: 8px 14px 8px 10px; font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; }
        
        .filter-group-title { font-family: 'Oswald', sans-serif; color: var(--accent-primary); font-size: 0.9rem; border-bottom: 1px dashed #333; padding-bottom: 4px; margin-bottom: 4px; margin-top: 8px; }
        .type-filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .filter-btn { display: flex; align-items: center; gap: 6px; font-family: 'Oswald', sans-serif; font-size: 0.85rem; text-transform: uppercase; border: 1px solid var(--text-dim); color: var(--text-dim); background: rgba(0,0,0,0.5); padding: 4px 10px; cursor: pointer; transition: 0.2s; border-radius: 2px; }
        .filter-btn:hover { border-color: var(--text-main); color: var(--text-main); }
        .filter-btn.active { border-color: var(--accent-primary); color: var(--accent-primary); background: rgba(255, 255, 255, 0.1); }

        /* Сетка Карточек */
        .compendium-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; align-items: start; }
        .compendium-card.expanded { grid-column: 1 / -1; }

        .panel-outer { background-color: var(--accent-primary); padding: var(--border-width); position: relative; display: flex; flex-direction: column; }
        .panel-inner { background-color: var(--bg-panel); padding: 16px 20px; height: 100%; display: flex; flex-direction: column; }
        .cut-tl { clip-path: polygon(var(--chamfer) 0, 100% 0, 100% 100%, 0 100%, 0 var(--chamfer)); }
        .hazard-tape { height: 6px; background: repeating-linear-gradient(45deg, #000 0px, #000 10px, var(--accent-primary) 10px, transparent 20px); border-bottom: 1px solid var(--accent-primary); }

        .card-header-clickable { cursor: pointer; position: relative; padding-right: 24px; user-select: none; }
        .expand-icon { position: absolute; right: 0; top: 10px; color: var(--text-dim); transition: transform 0.3s ease; }
        .panel-outer.expanded .expand-icon { transform: rotate(180deg); color: var(--accent-primary); }
        
        .class-title-wrapper { border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 8px;}
        .class-title { font-size: 1.4rem; color: var(--accent-primary); font-family: 'Oswald'; text-transform: uppercase; margin-bottom: 4px;}
        
        .types-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;}
        .type-badge { display: flex; align-items: center; gap: 4px; font-family: 'Oswald', sans-serif; font-size: 0.75rem; text-transform: uppercase; border: 1px solid; padding: 2px 6px; border-radius: 2px; background: rgba(0,0,0,0.5); }

        /* Внутренности карточки (Форматирование) */
        .talents-wrapper { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s ease; position: relative; }
        .panel-outer.expanded .talents-wrapper { max-height: 5000px; opacity: 1; margin-top: 12px; border-top: 1px dashed #333; padding-top: 12px; }

        .card-content-desc { font-size: 0.9rem; color: var(--text-main); white-space: pre-wrap; line-height: 1.5; }
        .creator-tag { font-size: 0.7rem; color: var(--text-dim); text-align: right; margin-top: 10px; font-style: italic;}

        /* Сворачиваемые под-блоки */
        .side-effect-block { margin-bottom: 12px; border-left: 2px solid var(--text-dim); padding: 8px 10px; cursor: pointer; position: relative; transition: 0.2s; background: rgba(255,255,255,0.02); }
        .side-effect-block:hover { border-color: var(--accent-primary); background: rgba(255,255,255,0.05); }
        .se-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 2px; }
        .se-name { font-family: 'Oswald', sans-serif; font-size: 1.1rem; color: var(--accent-primary); transition: 0.2s; }
        .se-collapse-icon { color: var(--text-dim); font-size: 0.8rem; transition: transform 0.3s; margin-right: 8px; }
        .side-effect-block.collapsed .se-collapse-icon { transform: rotate(-90deg); }
        .se-desc-wrapper { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.3s ease; margin-top: 6px; }
        .side-effect-block.collapsed .se-desc-wrapper { grid-template-rows: 0fr; margin-top: 0; }
        .se-desc { overflow: hidden; font-size: 0.9rem; color: var(--text-main); line-height: 1.5; white-space: pre-wrap; }

        /* СТИЛИ ДЛЯ MARKDOWN КОНТЕНТА */
        .md-content { white-space: normal; line-height: 1.5; }
        .md-content p { margin-bottom: 8px; margin-top: 0; }
        .md-content p:last-child { margin-bottom: 0; }
        .md-content strong, .md-content b { color: var(--accent-primary); font-family: 'Oswald', sans-serif; letter-spacing: 0.5px; font-weight: normal; }
        .md-content em, .md-content i { color: var(--text-dim); }
        .md-content ul, .md-content ol { margin-left: 20px; margin-bottom: 8px; margin-top: 0; }
        .md-content li { margin-bottom: 4px; }
        .md-content table { width: 100%; border-collapse: collapse; margin-top: 8px; margin-bottom: 8px; font-size: 0.85rem; }
        .md-content th, .md-content td { border: 1px solid #333; padding: 6px 10px; text-align: left; }
        .md-content th { background: rgba(255,255,255,0.05); color: var(--accent-primary); font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .md-content tr:nth-child(even) { background: rgba(255,255,255,0.02); }
        .md-content blockquote { border-left: 3px solid var(--accent-primary); padding-left: 10px; margin-left: 0; color: var(--text-dim); font-style: italic; }
        .md-content code { background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 3px; font-family: monospace; color: var(--color-yellow); }

        /* Управление карточкой */
        .card-controls { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid #222; padding-top: 12px; flex-wrap: wrap; }
        .ctrl-btn { flex: 1; background: transparent; border: 1px solid; padding: 6px; font-size: 0.75rem; font-family: 'Oswald'; cursor: pointer; text-transform: uppercase; transition: 0.2s;}
        .ctrl-edit { border-color: var(--color-yellow); color: var(--color-yellow); }
        .ctrl-edit:hover { background: var(--color-yellow); color: #000; }
        .ctrl-del { border-color: var(--color-red); color: var(--color-red); }
        .ctrl-del:hover { background: var(--color-red); color: #fff; }
        .ctrl-copy { border-color: var(--color-cyan); color: var(--color-cyan); }
        .ctrl-copy:hover { background: var(--color-cyan); color: #000; }
        .ctrl-dl { border-color: var(--text-main); color: var(--text-main); }
        .ctrl-dl:hover { background: var(--text-main); color: #000; }
        .ctrl-priv { border-color: #555; color: #555; }
        .ctrl-priv:hover { border-color: var(--color-red); color: var(--color-red); }

        .copy-msg-global { text-align: center; color: var(--accent-primary); font-size: 0.8rem; opacity: 0; transition: opacity 0.2s; font-family: 'Oswald', sans-serif; height: 0; margin-top: 4px; }

        /* Стат-блок бестиария */
        .stat-grid { display: flex; justify-content: space-between; text-align: center; margin: 12px 0; padding: 12px 0; border-top: 2px solid var(--accent-primary); border-bottom: 2px solid var(--accent-primary); }
        .stat-col { display: flex; flex-direction: column; width: 16%; }
        .stat-name { font-family: 'Oswald', sans-serif; color: var(--accent-primary); font-size: 1rem; }
        .stat-val { font-size: 0.9rem; font-weight: bold; }

        /* Модалки */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: flex-start; z-index: 2000; backdrop-filter: blur(4px); padding-top: 50px; overflow-y: auto; }
        .modal-overlay.active { display: flex; }
        .modal-box { width: 800px; max-width: 95%; position: relative; margin-bottom: 50px; }
        
        .cloud-input, .cloud-select { width: 100%; background: #111; border: 1px solid #333; color: var(--text-main); padding: 10px; margin-bottom: 12px; outline: none; font-family: 'Inter'; font-size: 0.95rem; }
        .cloud-input:focus, .cloud-select:focus { border-color: var(--accent-primary); }
        textarea.cloud-input { resize: vertical; min-height: 80px; }

        .btn-close-modal { background: transparent; border: none; color: var(--color-red); font-size: 1.5rem; cursor: pointer; transition: 0.2s; position: absolute; right: 16px; top: 16px; z-index: 10;}
        .btn-close-modal:hover { color: #ff0044; }

        .builder-checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        .builder-checkbox-label { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; cursor: pointer; color: var(--text-dim); }
        .builder-checkbox-label input { accent-color: var(--accent-primary); }

        .b-row { display: flex; gap: 10px; }
        .b-row .cloud-input, .b-row .cloud-select { flex: 1; }

        .b-se-entry { border: 1px solid #333; padding: 12px; margin-bottom: 12px; position: relative; background: rgba(255,255,255,0.02); border-left: 3px solid var(--accent-primary); }
        .btn-small-bld { background: transparent; border: 1px solid var(--text-dim); color: var(--text-dim); cursor: pointer; padding: 6px 12px; font-size: 0.8rem; text-transform: uppercase; transition: 0.2s; font-family: 'Oswald'; }
        .btn-small-bld:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

    </style>
</head>
<body>

    <a href="index.html" class="top-nav-btn"><i class="fa-solid fa-house"></i> ХАБ</a>

    <div class="auth-bar">
        <span id="user-info" class="tech-text"></span>
        <button class="auth-btn" id="btn-auth" onclick="window.toggleAuthModal()"><i class="fa-solid fa-user"></i> ВХОД</button>
    </div>

    <!-- Режимы -->
    <div class="mode-switcher">
        <button class="mode-btn active" data-mode="status" data-color="#45B3CB" onclick="window.switchMode('status', this)">СТАТУСЫ</button>
        <button class="mode-btn" data-mode="class" data-color="#1E3A8A" onclick="window.switchMode('class', this)">АРХЕТИПЫ</button>

        <button class="mode-btn" data-mode="gift" data-color="#E67E22" onclick="window.switchMode('gift', this)">Э.Г.О. ГИФТЫ</button>
        <button class="mode-btn" data-mode="equip" data-color="#9B59B6" onclick="window.switchMode('equip', this)">СНАРЯЖЕНИЕ</button>
        <button class="mode-btn" data-mode="bestiary" data-color="#8FCC2A" onclick="window.switchMode('bestiary', this)">БЕСТИАРИЙ</button>
    </div>

    <div class="header-bar">
        <div class="header-title oswald" id="page-title">ПОЛЬЗОВАТЕЛЬСКАЯ БАЗА: СТАТУСЫ</div>
    </div>

    <div class="action-bar">
        <button class="action-btn" onclick="window.openBuilder()"><i class="fa-solid fa-plus"></i> СОЗДАТЬ ЗАПИСЬ</button>
        <label class="action-btn" style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fa-solid fa-file-import"></i> ЗАГРУЗИТЬ JSON
            <input type="file" id="json-upload" accept=".json" style="display: none;" onchange="window.uploadJson(event)">
        </label>
    </div>

    <!-- Блок Фильтров -->
    <div class="filters-section" id="filters-container"></div>

    <!-- Сетка Карточек -->
    <div class="compendium-grid" id="compendium">
        <div class="tech-text" style="grid-column: 1/-1; text-align: center;">ЗАГРУЗКА БАЗЫ ДАННЫХ...</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ И ПРОФИЛЯ -->
    <div class="modal-overlay" id="authModal" onclick="window.closeModalOnBg(event, 'authModal')">
        <div class="panel-outer cut-tl modal-box" style="width: 400px; background-color: var(--accent-primary);">
            <div class="panel-inner cut-tl">
                <button class="btn-close-modal" onclick="window.toggleAuthModal()"><i class="fa-solid fa-xmark"></i></button>
                <div class="class-title" style="margin-bottom: 20px;">ПАНЕЛЬ ДОСТУПА</div>
                
                <!-- Неавторизованный вид -->
                <div id="auth-unlogged">
                    <input type="email" id="auth-email" class="cloud-input" placeholder="Email">
                    <input type="password" id="auth-pass" class="cloud-input" placeholder="Пароль">
                    <button class="action-btn" style="width: 100%; margin-bottom: 8px;" onclick="window.login()"><i class="fa-solid fa-right-to-bracket"></i> ВОЙТИ</button>
                    <button class="action-btn" style="width: 100%; border-color: var(--text-dim); color: var(--text-dim);" onclick="window.register()"><i class="fa-solid fa-user-plus"></i> РЕГИСТРАЦИЯ</button>
                </div>

                <!-- Авторизованный вид (Профиль) -->
                <div id="auth-logged" style="display: none;">
                    <div class="tech-text" style="margin-bottom: 4px;">ВАШ НИКНЕЙМ (ОТОБРАЖАЕТСЯ КАК АВТОР)</div>
                    <input type="text" id="auth-nickname" class="cloud-input" placeholder="Введите никнейм...">
                    <button class="action-btn" style="width: 100%; margin-bottom: 16px; border-color: var(--color-yellow); color: var(--color-yellow);" onclick="window.updateNickname()"><i class="fa-solid fa-floppy-disk"></i> СОХРАНИТЬ НИКНЕЙМ</button>
                    <button class="action-btn" style="width: 100%; border-color: var(--text-dim); color: var(--text-dim);" onclick="window.logoutUser()"><i class="fa-solid fa-power-off"></i> ВЫЙТИ ИЗ АККАУНТА</button>
                </div>

            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО КОНСТРУКТОРА -->
    <div class="modal-overlay" id="builderModal">
        <div class="panel-outer cut-tl modal-box" style="background-color: var(--accent-primary);">
            <div class="panel-inner cut-tl" style="padding-top: 40px;">
                <button class="btn-close-modal" onclick="window.closeBuilder()"><i class="fa-solid fa-xmark"></i></button>
                <div class="class-title" id="builder-title" style="margin-bottom: 20px; border-bottom: 1px solid var(--accent-primary); padding-bottom: 8px;">КОНСТРУКТОР</div>
                
                <div class="tech-text" style="color: var(--color-yellow); margin-bottom: 16px;">

                <div id="dynamic-form-fields"></div>

                <button class="action-btn" style="width: 100%; margin-top: 20px;" onclick="window.saveEntry()"><i class="fa-solid fa-cloud-arrow-up"></i> СОХРАНИТЬ В БАЗУ</button>
            </div>
        </div>
    </div>

            "Affiliation": { name: "Принадлежность", color: "#F1C40F" }, "Weapon": { name: "Оружие", color: "#C7243A" }, 
            "Status": { name: "Статус", color: "#8FCC2A" }, "Sin": { name: "Грех", color: "#45B3CB" },

        const dictRarity = {
            "Common": { name: "Common", color: "#B0B0B0" }, "Uncommon": { name: "Uncommon", color: "#2ECC71" },
            "Rare": { name: "Rare", color: "#3498DB" }, "Very Rare": { name: "Very Rare", color: "#9B59B6" },
            "Legendary": { name: "Legendary", color: "#F1C40F" }
        };
        const dictBestiaryCats = {
            "ZAYIN": { name: "ZAYIN", color: "#27AE60" }, "TETH": { name: "TETH", color: "#45B3CB" },
            "HE": { name: "HE", color: "#F1C40F" }, "WAW": { name: "WAW", color: "#9B59B6" },
            "ALEPH": { name: "ALEPH", color: "#C7243A" }, "City": { name: "Город", color: "#696969" },
            "Distortions": { name: "Искажения", color: "#E0D8C8" }
        };

        let selectedFilters = { types: new Set(), stats: new Set(), bases: new Set(), rarities: new Set(), levels: new Set(), cats: new Set() };

        onAuthStateChanged(auth, (user) => {
            const info = document.getElementById('user-info');
            const unlogged = document.getElementById('auth-unlogged');
            const logged = document.getElementById('auth-logged');
            
            if (user) {
                currentUser = user;
                const savedNick = window.localStorage.getItem('custom_nickname') || user.email.split('@')[0];
                info.innerText = savedNick;
                
                unlogged.style.display = 'none';
                logged.style.display = 'block';
                document.getElementById('auth-nickname').value = savedNick;
            } else {
                currentUser = null;
                info.innerText = '';
                
                unlogged.style.display = 'block';
                logged.style.display = 'none';
            }
            renderGrid(); 
        });

        window.toggleAuthModal = () => document.getElementById('authModal').classList.toggle('active');
        window.closeModalOnBg = (e, id) => { if (e.target.id === id) document.getElementById(id).classList.remove('active'); };

        window.login = async () => {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            try { await signInWithEmailAndPassword(auth, e, p); window.toggleAuthModal(); } 
            catch (error) { alert("Ошибка входа: " + error.message); }
        };
        window.register = async () => {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            try { await createUserWithEmailAndPassword(auth, e, p); window.toggleAuthModal(); } 
            catch (error) { alert("Ошибка регистрации: " + error.message); }
        };
        window.logoutUser = () => {
            signOut(auth);
            window.toggleAuthModal();
        };

        window.updateNickname = async () => {
            if (!currentUser) return;
            const newName = document.getElementById('auth-nickname').value.trim();
            if (!newName) return alert('Никнейм не может быть пустым');
            
            window.localStorage.setItem('custom_nickname', newName);
            document.getElementById('user-info').innerText = newName;

            try {
                const q = query(collection(db, "custom_content"), where("creatorEmail", "==", currentUser.email));
                const querySnapshot = await getDocs(q);
                
                const updatePromises = [];
                querySnapshot.forEach((docSnap) => {
                    updatePromises.push(setDoc(doc(db, "custom_content", docSnap.id), { creator: newName }, { merge: true }));
                });
                
                if (updatePromises.length > 0) {
                    await Promise.all(updatePromises);
                    alert(`Никнейм успешно обновлен для ${updatePromises.length} записей!`);
                    loadDatabase();
                } else {
                    alert('Никнейм сохранен. У вас пока нет опубликованных записей.');
                }
            } catch(e) {
                console.error(e);
                alert('Произошла ошибка при обновлении базы данных.');
            }
        };

        window.switchMode = (mode, btn) => {
            currentMode = mode;
            const color = btn.getAttribute('data-color');
            document.documentElement.style.setProperty('--accent-primary', color);
            
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.getElementById('page-title').innerText = `ПОЛЬЗОВАТЕЛЬСКАЯ БАЗА: ${modeTitles[mode]}`;
            
            selectedFilters = { types: new Set(), stats: new Set(), bases: new Set(), rarities: new Set(), levels: new Set(), cats: new Set() };
            renderFilters();
            renderGrid();
        };

        function renderFilters() {
            const container = document.getElementById('filters-container');
            let html = `
                <div class="search-wrapper cut-tl">
                    <div class="search-inner cut-tl">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="search" id="search-input" class="search-input" placeholder="Поиск по названию или описанию..." onkeyup="window.filterItems()" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');">
                    </div>
                </div>
            `;

            const makeGroup = (title, dict, filterKey) => {
                let groupHtml = `<div class="filter-group-title">${title}</div><div class="type-filters">`;
                groupHtml += `<button class="filter-btn ${selectedFilters[filterKey].size === 0 ? 'active' : ''}" onclick="window.clearFilter('${filterKey}')">ВСЕ</button>`;
                for (const [key, data] of Object.entries(dict)) {
                    const isActive = selectedFilters[filterKey].has(key) ? 'active' : '';
                    const style = isActive ? `border-color: ${data.color}; color: ${data.color};` : '';
                    groupHtml += `<button class="filter-btn ${isActive}" style="${style}" onclick="window.toggleFilter('${filterKey}', '${key}')">${data.name}</button>`;
                }
                groupHtml += `</div>`;
                return groupHtml;
            };

            if (currentMode === 'class') {
                html += makeGroup('ТИПЫ ЭФФЕКТОВ', dictTypes, 'types');
                html += makeGroup('ХАРАКТЕРИСТИКИ', dictStats, 'stats');
            } else if (currentMode === 'feat') {
                html += makeGroup('БАЗОВЫЕ КАТЕГОРИИ', dictFeatBases, 'bases');
            } else if (currentMode === 'gift') {
                html += makeGroup('ТИПЫ ЭФФЕКТОВ', dictTypes, 'types');
                let lvlHtml = `<div class="filter-group-title">УРОВЕНЬ</div><div class="type-filters"><button class="filter-btn ${selectedFilters.levels.size === 0 ? 'active' : ''}" onclick="window.clearFilter('levels')">ВСЕ</button>`;
                [1,2,3,4,5].forEach(l => {
                    const isActive = selectedFilters.levels.has(l.toString()) ? 'active' : '';
                    lvlHtml += `<button class="filter-btn ${isActive}" onclick="window.toggleFilter('levels', '${l}')">Ур. ${l}</button>`;
                });
                html += lvlHtml + `</div>`;
            } else if (currentMode === 'equip') {
                html += makeGroup('ТИПЫ ЭФФЕКТОВ (ДЛЯ ОРУЖИЯ)', dictTypes, 'types');
                html += makeGroup('СКАЕЙЛИНГ', dictStats, 'stats');
                html += makeGroup('РЕДКОСТЬ', dictRarity, 'rarities');
            } else if (currentMode === 'bestiary') {
                html += makeGroup('УРОВЕНЬ УГРОЗЫ', dictBestiaryCats, 'cats');
            }

            container.innerHTML = html;
        }

        window.toggleFilter = (filterKey, val) => {
            if (selectedFilters[filterKey].has(val)) selectedFilters[filterKey].delete(val);
            else selectedFilters[filterKey].add(val);
            renderFilters();
            window.filterItems();
        };

        window.clearFilter = (filterKey) => {
            selectedFilters[filterKey].clear();
            renderFilters();
            window.filterItems();
        };

        window.filterItems = () => {
            const query = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.compendium-card').forEach(card => {
                const name = (card.getAttribute('data-name') || '').toLowerCase();
                const desc = (card.getAttribute('data-desc') || '').toLowerCase();
                
                const cTypes = (card.getAttribute('data-types') || '').split(',');
                const cStats = (card.getAttribute('data-stats') || '').split(',');
                const cBases = (card.getAttribute('data-bases') || '').split(',');
                const cRarity = card.getAttribute('data-rarity') || '';
                const cLevel = card.getAttribute('data-level') || '';
                const cCats = (card.getAttribute('data-cats') || '').split(',');

                const matchQ = name.includes(query) || desc.includes(query);
                
                const matchType = selectedFilters.types.size === 0 || cTypes.some(t => selectedFilters.types.has(t));
                const matchStat = selectedFilters.stats.size === 0 || [...selectedFilters.stats].every(s => cStats.includes(s));
                const matchBase = selectedFilters.bases.size === 0 || cBases.some(b => selectedFilters.bases.has(b));
                const matchRarity = selectedFilters.rarities.size === 0 || selectedFilters.rarities.has(cRarity);
                const matchLevel = selectedFilters.levels.size === 0 || selectedFilters.levels.has(cLevel);
                const matchCat = selectedFilters.cats.size === 0 || cCats.some(c => selectedFilters.cats.has(c));

                if (matchQ && matchType && matchStat && matchBase && matchRarity && matchLevel && matchCat) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        };

        async function loadDatabase() {
            try {
                const querySnapshot = await getDocs(collection(db, "custom_content"));
                dbCache = [];
                querySnapshot.forEach((docSnap) => {
                    dbCache.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderFilters();
                renderGrid();
            } catch (e) {
                document.getElementById('compendium').innerHTML = '<div class="tech-text" style="color: var(--color-red); grid-column:1/-1; text-align:center;">ОШИБКА ДОСТУПА К БАЗЕ</div>';
            }
        }

        // БЕЗОПАСНЫЕ ФУНКЦИИ ПАРСИНГА
        function safeJoin(val, sep = ', ') {
            if (!val) return '';
            return Array.isArray(val) ? val.join(sep) : String(val);
        }

        function createBadges(arr, dict) {
            if (!arr) return '';
            if (typeof arr === 'string') arr = [arr];
            if (!Array.isArray(arr)) return '';
            
            let html = '';
            arr.forEach(val => {
                const conf = dict[val] || {name: val, color: 'var(--text-dim)'};
                html += `<div class="type-badge" style="color: ${conf.color}; border-color: ${conf.color};">${conf.name}</div>`;
            });
            return html;
        }

        function parseMD(str) {
            if (!str) return '';
            return marked.parse(str);
        }

        window.toggleSubBlock = (e, el) => {
            e.stopPropagation();
            el.closest('.side-effect-block').classList.toggle('collapsed');
        };

        window.copySubBlockText = (el) => {
            const titleEl = el.querySelector('.se-name');
            const descEl = el.querySelector('.se-desc');
            const levelEl = el.querySelector('.tech-text'); 
            
            let textToCopy = titleEl ? titleEl.innerText : '';
            if (levelEl) textToCopy += ` [${levelEl.innerText}]`;
            textToCopy += '\n' + (descEl ? descEl.innerText : '');
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const msg = el.closest('.talents-wrapper').querySelector('.copy-msg-global');
                if (msg) {
                    const oldText = msg.innerText;
                    msg.innerText = 'ПОДБЛОК СКОПИРОВАН В БУФЕР!';
                    msg.style.opacity = '1';
                    msg.style.height = 'auto';
                    setTimeout(() => { 
                        msg.style.opacity = '0'; 
                        msg.style.height = '0'; 
                        setTimeout(() => msg.innerText = oldText, 200);
                    }, 2000);
                }
            });
        };

        window.copyEntry = (id, btn) => {
            const item = dbCache.find(i => i.id === id);
            if (!item) return;
            const d = item.data;
            
            let textToCopy = `=== ${d.Name || d.characterName || 'Без названия'} ===\n`;
            
            if (currentMode === 'status') {
                textToCopy += `${d.Effect}\n`;
                if(d.SideEffects) d.SideEffects.forEach(se => textToCopy += `\n* ${se.sideeffectname}:\n${se.sideeffect}\n`);
            } else if (currentMode === 'class') {
                textToCopy += `Типы: ${safeJoin(d.Type)} | Статы: ${safeJoin(d.Stats)}\n\n`;
                if (d.Talents) d.Talents.forEach(t => textToCopy += `[Ур. ${t.level}] ${t.name}\n${t.desc}\n\n`);
            } else if (currentMode === 'feat') {
                if(d.Need) textToCopy += `Требования: ${d.Need}\n`;
                textToCopy += `Категории: ${safeJoin(d.Base)}\n\n${d.desc}\n`;
            } else if (currentMode === 'gift') {
                textToCopy += `[Ур. ${d.Level}] Типы: ${safeJoin(d.Type)}\n\n${d.Description}\n`;
            } else if (currentMode === 'equip') {
                textToCopy += `[Ур. ${d.Level} | ${d.Rarity}] ${d.ItemType}\n`;
                if(d.Need) textToCopy += `Требования: ${d.Need}\n`;
                textToCopy += `Скейлинг: ${safeJoin(d.Stats)}\n\n${d.Desc}\n`;
            } else if (currentMode === 'bestiary') {
                textToCopy += `${d.Meta || ''}\nКД: ${d.ArmorClass} | ХП: ${d.HitPoints} | Скорость: ${d.Speed}\n`;
                textToCopy += `STR ${d.Stats?.STR}, DEX ${d.Stats?.DEX}, CON ${d.Stats?.CON}, INT ${d.Stats?.INT}, WIS ${d.Stats?.WIS}, CHA ${d.Stats?.CHA}\n\n`;
                if (d.Traits) d.Traits.forEach(t => textToCopy += `${t.name}. ${t.desc}\n`);
                if (d.Actions) {
                    textToCopy += `\nДЕЙСТВИЯ:\n`;
                    d.Actions.forEach(a => textToCopy += `${a.name}. ${a.desc}\n`);
                }
                if (d.Lore) textToCopy += `\nЛОР:\n${d.Lore}\n`;
            }
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const msg = btn.closest('.talents-wrapper').querySelector('.copy-msg-global');
                msg.innerText = 'ВЕСЬ ЭЛЕМЕНТ СКОПИРОВАН В БУФЕР!';
                msg.style.opacity = '1';
                msg.style.height = 'auto';
                setTimeout(() => { msg.style.opacity = '0'; msg.style.height = '0'; }, 2000);
            });
        };

        window.downloadCustomJson = (id) => {
            const item = dbCache.find(i => i.id === id);
            if (!item) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify([item.data], null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", (item.data.Name || item.data.characterName || "Custom_Item") + ".json");
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        };

        window.togglePrivacy = async (id) => {
            const item = dbCache.find(i => i.id === id);
            if (!item) return;
            
            const newStatus = !item.isPrivate;
            try {
                await setDoc(doc(db, "custom_content", id), { isPrivate: newStatus }, { merge: true });
                item.isPrivate = newStatus;
                renderGrid();
            } catch(e) {
                alert("Ошибка обновления статуса приватности.");
            }
        };

        // --- ГЕНЕРАЦИЯ КАРТОЧЕК ---
        function renderGrid() {
            const container = document.getElementById('compendium');
            const items = dbCache.filter(i => i.type === currentMode);
            
            if (items.length === 0) {
                container.innerHTML = '<div class="tech-text" style="grid-column: 1/-1; text-align: center;">НЕТ ПОЛЬЗОВАТЕЛЬСКИХ ЗАПИСЕЙ В ЭТОЙ КАТЕГОРИИ</div>';
                return;
            }

            let html = '';
            items.forEach(item => {
                const isOwnerOrAdmin = currentUser && (item.creatorEmail === currentUser.email || adminEmails.includes(currentUser.email));
                
                if (item.isPrivate && !isOwnerOrAdmin) return;
                
                let controlsHtml = `
                    <div class="card-controls">
                        <button class="ctrl-btn ctrl-copy" onclick="window.copyEntry('${item.id}', this)"><i class="fa-regular fa-copy"></i> ТЕКСТ</button>
                        <button class="ctrl-btn ctrl-dl" onclick="window.downloadCustomJson('${item.id}')"><i class="fa-solid fa-download"></i> JSON</button>
                        ${isOwnerOrAdmin ? `
                            <button class="ctrl-btn ctrl-priv" title="Скрыть/Показать" onclick="window.togglePrivacy('${item.id}')"><i class="fa-solid ${item.isPrivate ? 'fa-eye' : 'fa-eye-slash'}"></i></button>
                            <button class="ctrl-btn ctrl-edit" onclick="window.editEntry('${item.id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="ctrl-btn ctrl-del" onclick="window.deleteEntry('${item.id}')"><i class="fa-solid fa-trash"></i></button>
                        ` : ''}
                    </div>
                    <div class="copy-msg-global">СКОПИРОВАНО В БУФЕР!</div>
                `;

                const d = item.data;
                let descHtml = '';
                let badgesHtml = '';
                let metaString = '';
                
                if (item.isPrivate) {
                    badgesHtml += `<div class="type-badge" style="color:var(--color-red); border-color:var(--color-red);"><i class="fa-solid fa-lock"></i> ПРИВАТНО</div>`;
                }

                let dTypes = safeJoin(d.Type, ',');
                let dStats = safeJoin(d.Stats, ',');
                let dBases = safeJoin(d.Base, ',');
                let dRarity = d.Rarity || '';
                let dLevel = d.Level || '';
                let dCats = safeJoin(d.Category, ',');
                let fullDesc = '';

                if (currentMode === 'status') {
                    fullDesc = d.Effect || '';
                    descHtml = `<div class="md-content" style="margin-bottom:12px;"><b>Эффект:</b><br>${parseMD(d.Effect)}</div>`;
                    if (d.SideEffects && d.SideEffects.length > 0) {
                        d.SideEffects.forEach(se => {
                            descHtml += `
                                <div class="side-effect-block collapsed" onclick="window.copySubBlockText(this)" style="border-left-color:var(--color-yellow);">
                                    <div class="se-header" onclick="window.toggleSubBlock(event, this)">
                                        <div style="display:flex; align-items:center;">
                                            <i class="fa-solid fa-chevron-down se-collapse-icon"></i>
                                            <span class="se-name" style="color:var(--color-yellow);">${se.sideeffectname}</span>
                                        </div>
                                    </div>
                                    <div class="se-desc-wrapper"><div class="se-desc md-content">${parseMD(se.sideeffect)}</div></div>
                                </div>`;
                            fullDesc += ' ' + se.sideeffectname + ' ' + se.sideeffect;
                        });
                    }
                } 
                else if (currentMode === 'class') {
                    badgesHtml += createBadges(d.Type, dictTypes) + createBadges(d.Stats, dictStats);
                    descHtml = `<div class="card-content-desc" style="margin-bottom:12px;"><b>Типы:</b> ${safeJoin(d.Type)} | <b>Статы:</b> ${safeJoin(d.Stats)}</div>`;
                    if (d.Talents) {
                        d.Talents.forEach(t => {
                            const c = t.Color || t.color || 'var(--accent-primary)';
                            descHtml += `
                                <div class="side-effect-block collapsed" onclick="window.copySubBlockText(this)" style="border-left-color:${c};">
                                    <div class="se-header" onclick="window.toggleSubBlock(event, this)">
                                        <div style="display:flex; align-items:baseline; gap:8px;">
                                            <i class="fa-solid fa-chevron-down se-collapse-icon"></i>
                                            <span class="se-name" style="color:${c};">${t.name}</span>
                                            <span class="tech-text" style="color:var(--text-dim); font-size:0.75rem;">Ур. ${t.level}</span>
                                        </div>
                                    </div>
                                    <div class="se-desc-wrapper"><div class="se-desc md-content">${parseMD(t.desc)}</div></div>
                                </div>`;
                            fullDesc += ' ' + t.name + ' ' + t.desc;
                        });
                    }
                }
                else if (currentMode === 'feat') {
                    badgesHtml += createBadges(d.Base, dictFeatBases);
                    if(d.Need) descHtml += `<div class="tech-text" style="color:var(--color-red); margin-bottom:8px;">ТРЕБОВАНИЯ: ${d.Need}</div>`;
                    descHtml += `<div class="md-content">${parseMD(d.desc)}</div>`;
                    fullDesc = d.desc || '';
                }
                else if (currentMode === 'gift') {
                    metaString = `УРОВЕНЬ ${d.Level}`;
                    badgesHtml += createBadges(d.Type, dictTypes);
                    descHtml = `<div class="md-content">${parseMD(d.Description)}</div>`;
                    fullDesc = d.Description || '';
                }
                else if (currentMode === 'equip') {
                    metaString = `УР. ${d.Level} | ${d.Rarity} | ${d.ItemType}`;
                    if(d.IsEGO) badgesHtml += `<div class="type-badge" style="color:#D94285; border-color:#D94285;">Э.Г.О.</div>`;
                    badgesHtml += createBadges(d.Type, dictTypes) + createBadges(d.Stats, dictStats);
                    if(d.Need) descHtml += `<div class="tech-text" style="color:var(--color-red); margin-bottom:8px;">ТРЕБОВАНИЯ: ${d.Need}</div>`;
                    descHtml += `<div class="md-content">${parseMD(d.Desc)}</div>`;
                    fullDesc = d.Desc || '';
                }
                else if (currentMode === 'bestiary') {
                    metaString = d.Meta || '';
                    badgesHtml += createBadges(d.Category, dictBestiaryCats);
                    descHtml = `<div class="card-content-desc" style="margin-bottom:10px;"><b>КД:</b> ${d.ArmorClass} | <b>ХП:</b> ${d.HitPoints} | <b>Скорость:</b> ${d.Speed}</div>`;
                    descHtml += `<div class="stat-grid">
                        <div class="stat-col"><span class="stat-name">STR</span><span class="stat-val">${d.Stats?.STR}</span></div>
                        <div class="stat-col"><span class="stat-name">DEX</span><span class="stat-val">${d.Stats?.DEX}</span></div>
                        <div class="stat-col"><span class="stat-name">CON</span><span class="stat-val">${d.Stats?.CON}</span></div>
                        <div class="stat-col"><span class="stat-name">INT</span><span class="stat-val">${d.Stats?.INT}</span></div>
                        <div class="stat-col"><span class="stat-name">WIS</span><span class="stat-val">${d.Stats?.WIS}</span></div>
                        <div class="stat-col"><span class="stat-name">CHA</span><span class="stat-val">${d.Stats?.CHA}</span></div>
                    </div>`;
                    
                    if (d.Traits && d.Traits.length > 0) {
                        descHtml += `<div class="tech-text" style="color:var(--color-yellow); margin-top:10px; margin-bottom:6px;">ОСОБЕННОСТИ</div>`;
                        d.Traits.forEach(t => {
                            descHtml += `
                                <div class="side-effect-block collapsed" onclick="window.copySubBlockText(this)" style="border-left-color:var(--color-yellow);">
                                    <div class="se-header" onclick="window.toggleSubBlock(event, this)">
                                        <div style="display:flex; align-items:center;">
                                            <i class="fa-solid fa-chevron-down se-collapse-icon"></i>
                                            <span class="se-name" style="color:var(--color-yellow);">${t.name}</span>
                                        </div>
                                    </div>
                                    <div class="se-desc-wrapper"><div class="se-desc md-content">${parseMD(t.desc)}</div></div>
                                </div>`;
                            fullDesc += ' ' + t.name + ' ' + t.desc;
                        });
                    }
                    if (d.Actions && d.Actions.length > 0) {
                        descHtml += `<div class="tech-text" style="color:var(--color-red); margin-top:10px; margin-bottom:6px;">ДЕЙСТВИЯ</div>`;
                        d.Actions.forEach(a => {
                            descHtml += `
                                <div class="side-effect-block collapsed" onclick="window.copySubBlockText(this)" style="border-left-color:var(--color-red);">
                                    <div class="se-header" onclick="window.toggleSubBlock(event, this)">
                                        <div style="display:flex; align-items:center;">
                                            <i class="fa-solid fa-chevron-down se-collapse-icon"></i>
                                            <span class="se-name" style="color:var(--color-red);">${a.name}</span>
                                        </div>
                                    </div>
                                    <div class="se-desc-wrapper"><div class="se-desc md-content">${parseMD(a.desc)}</div></div>
                                </div>`;
                            fullDesc += ' ' + a.name + ' ' + a.desc;
                        });
                    }
                    if (d.Lore) {
                        descHtml += `<div class="md-content" style="margin-top:10px; border-top:1px dashed #333; padding-top:10px;">${parseMD(d.Lore)}</div>`;
                        fullDesc += ' ' + d.Lore;
                    }
                }

                html += `
                    <div class="panel-outer cut-tl compendium-card" data-name="${d.Name||d.characterName||''}" data-desc="${fullDesc}" data-types="${dTypes}" data-stats="${dStats}" data-bases="${dBases}" data-rarity="${dRarity}" data-level="${dLevel}" data-cats="${dCats}">
                        <div class="hazard-tape"></div>
                        <div class="panel-inner cut-tl" style="border-top: none;">
                            <div class="card-header-clickable" onclick="this.closest('.panel-outer').classList.toggle('expanded')">
                                <i class="fa-solid fa-chevron-down expand-icon"></i>
                                <div class="class-title-wrapper">
                                    ${metaString ? `<div class="tech-text" style="margin-bottom:2px;">${metaString}</div>` : ''}
                                    <div class="class-title">${d.Name || d.characterName || 'Без названия'}</div>
                                </div>
                                ${badgesHtml ? `<div class="types-container">${badgesHtml}</div>` : ''}
                            </div>
                            <div class="talents-wrapper">
                                <div style="margin-bottom:16px;">${descHtml}</div>
                                <div class="creator-tag">Автор: ${item.creator}</div>
                                ${controlsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            if (html === '') html = '<div class="tech-text" style="grid-column: 1/-1; text-align: center;">ПОДХОДЯЩИЕ ЗАПИСИ НЕ НАЙДЕНЫ</div>';
            container.innerHTML = html;
        }

        window.deleteEntry = async (id) => {
            if (!confirm("Удалить эту запись навсегда?")) return;
            try {
                await deleteDoc(doc(db, "custom_content", id));
                dbCache = dbCache.filter(i => i.id !== id);
                renderGrid();
            } catch(e) { alert("Ошибка удаления."); }
        };

        window.openBuilder = () => {
            if (!currentUser) return alert("Для создания контента необходимо авторизоваться.");
            currentEditId = null;
            document.getElementById('builder-title').innerText = `СОЗДАТЬ: ${modeTitles[currentMode]}`;
            renderBuilderForm({}, false);
            document.getElementById('builderModal').classList.add('active');
        };

        window.closeBuilder = () => document.getElementById('builderModal').classList.remove('active');

        window.editEntry = (id) => {
            const item = dbCache.find(i => i.id === id);
            if (!item) return;
            currentEditId = id;
            document.getElementById('builder-title').innerText = `РЕДАКТИРОВАНИЕ`;
            renderBuilderForm(item.data, item.isPrivate);
            document.getElementById('builderModal').classList.add('active');
        };

        function getChecks(dict, groupClass, selectedArr = []) {
            let h = `<div class="builder-checkbox-group">`;
            for (const [key, data] of Object.entries(dict)) {
                const checked = selectedArr.includes(key) ? 'checked' : '';
                h += `<label class="builder-checkbox-label"><input type="checkbox" class="${groupClass}" value="${key}" ${checked}> ${data.name}</label>`;
            }
            h += `</div>`;
            return h;
        }

        function renderBuilderForm(data = {}, isPrivate = false) {
            const container = document.getElementById('dynamic-form-fields');
            let html = `<div class="tech-text" style="margin-bottom:4px;">НАЗВАНИЕ (NAME)</div><input type="text" id="bf-name" class="cloud-input" placeholder="Название..." value="${data.Name || ''}">`;

            if (currentMode === 'status') {
                html += `<div class="tech-text" style="margin-bottom:4px;">ЭФФЕКТ (EFFECT)</div><textarea id="bf-effect" class="cloud-input" placeholder="Основной эффект (Поддерживает Markdown)">${data.Effect || ''}</textarea>`;
                html += `<div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid #333; padding-bottom:8px; margin-bottom:12px;">
                            <div class="tech-text" style="color:var(--color-yellow);">САЙД-ЭФФЕКТЫ</div>
                            <button class="btn-small-bld" onclick="window.addBItem('bf-side-container', 'sideeffect')">+ ДОБАВИТЬ</button>
                         </div><div id="bf-side-container"></div>`;
            } 
            else if (currentMode === 'class') {
                html += `<div class="tech-text" style="margin-bottom:4px;">ТИПЫ УРОНА/СТАТУСА</div>` + getChecks(dictTypes, 'b-type-check', data.Type);
                html += `<div class="tech-text" style="margin-bottom:4px;">ХАРАКТЕРИСТИКИ</div>` + getChecks(dictStats, 'b-stat-check', data.Stats);
                html += `<div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid #333; padding-bottom:8px; margin-bottom:12px;">
                            <div class="tech-text" style="color:var(--color-yellow);">ТАЛАНТЫ</div>
                            <button class="btn-small-bld" onclick="window.addBItem('bf-talent-container', 'talent')">+ ДОБАВИТЬ</button>
                         </div><div id="bf-talent-container"></div>`;
            }
            else if (currentMode === 'feat') {
                html += `<div class="tech-text" style="margin-bottom:4px;">ТРЕБОВАНИЯ</div><input type="text" id="bf-need" class="cloud-input" placeholder="Например: Сила 15" value="${data.Need || ''}">`;
                html += `<div class="tech-text" style="margin-bottom:4px;">КАТЕГОРИИ</div>` + getChecks(dictFeatBases, 'b-base-check', data.Base);
                html += `<div class="tech-text" style="margin-bottom:4px;">ОПИСАНИЕ</div><textarea id="bf-desc" class="cloud-input" placeholder="Описание черты (Поддерживает Markdown)...">${data.desc || ''}</textarea>`;
            }
            else if (currentMode === 'gift') {
                html += `<div class="tech-text" style="margin-bottom:4px;">УРОВЕНЬ</div><select id="bf-level" class="cloud-select">`;
                [1,2,3,4,5].forEach(l => html += `<option value="${l}" ${data.Level == l ? 'selected' : ''}>Уровень ${l}</option>`);
                html += `</select>`;
                html += `<div class="tech-text" style="margin-bottom:4px;">ТИПЫ УРОНА/СТАТУСА</div>` + getChecks(dictTypes, 'b-type-check', data.Type);
                html += `<div class="tech-text" style="margin-bottom:4px;">ОПИСАНИЕ</div><textarea id="bf-desc" class="cloud-input" placeholder="Описание гифта (Поддерживает Markdown)...">${data.Description || ''}</textarea>`;
            }
            else if (currentMode === 'equip') {
                html += `<div class="b-row">
                            <div style="flex:1;"><div class="tech-text" style="margin-bottom:4px;">УРОВЕНЬ</div><input type="number" id="bf-level" class="cloud-input" value="${data.Level || 1}" min="1"></div>
                            <div style="flex:1;"><div class="tech-text" style="margin-bottom:4px;">ТИП ПРЕДМЕТА</div><select id="bf-itemtype" class="cloud-select">
                                <option value="Weapon" ${data.ItemType=='Weapon'?'selected':''}>Оружие</option>
                                <option value="Armor" ${data.ItemType=='Armor'?'selected':''}>Броня</option>
                                <option value="Mod" ${data.ItemType=='Mod'?'selected':''}>Мод/Аугмент</option>
                            </select></div>
                            <div style="flex:1;"><div class="tech-text" style="margin-bottom:4px;">РЕДКОСТЬ</div><select id="bf-rarity" class="cloud-select">
                                ${Object.keys(dictRarity).map(k => `<option value="${k}" ${data.Rarity==k?'selected':''}>${k}</option>`).join('')}
                            </select></div>
                         </div>`;
                html += `<div class="builder-checkbox-group"><label class="builder-checkbox-label"><input type="checkbox" id="bf-isego" ${data.IsEGO?'checked':''}> Является Э.Г.О. экипировкой</label></div>`;
                html += `<div class="tech-text" style="margin-bottom:4px;">ТРЕБОВАНИЯ</div><input type="text" id="bf-need" class="cloud-input" placeholder="Например: Сила 15" value="${data.Need || ''}">`;
                html += `<div class="tech-text" style="margin-bottom:4px;">ТИПЫ УРОНА (ДЛЯ ОРУЖИЯ)</div>` + getChecks(dictTypes, 'b-type-check', data.Type);
                html += `<div class="tech-text" style="margin-bottom:4px;">СКАЕЙЛИНГ</div>` + getChecks(dictStats, 'b-stat-check', data.Stats);
                html += `<div class="tech-text" style="margin-bottom:4px;">ОПИСАНИЕ</div><textarea id="bf-desc" class="cloud-input" placeholder="(Поддерживает Markdown)">${data.Desc || ''}</textarea>`;
            }
            else if (currentMode === 'bestiary') {
                html += `<div class="tech-text" style="margin-bottom:4px;">МЕТА (Например: Средняя нежить, хаотично-злая)</div><input type="text" id="bf-meta" class="cloud-input" value="${data.Meta || ''}">`;
                html += `<div class="tech-text" style="margin-bottom:4px;">УРОВЕНЬ УГРОЗЫ</div>` + getChecks(dictBestiaryCats, 'b-cat-check', data.Category);
                html += `<div class="b-row">
                            <div style="flex:1;"><div class="tech-text">КД (AC)</div><input type="text" id="bf-ac" class="cloud-input" value="${data.ArmorClass || ''}"></div>
                            <div style="flex:1;"><div class="tech-text">ХП (HP)</div><input type="text" id="bf-hp" class="cloud-input" value="${data.HitPoints || ''}"></div>
                            <div style="flex:1;"><div class="tech-text">СКОРОСТЬ</div><input type="text" id="bf-speed" class="cloud-input" value="${data.Speed || ''}"></div>
                         </div>`;
                const st = data.Stats || {};
                html += `<div class="b-row">
                            <div style="flex:1;"><div class="tech-text">STR</div><input type="text" id="bf-str" class="cloud-input" value="${st.STR || '10 (+0)'}"></div>
                            <div style="flex:1;"><div class="tech-text">DEX</div><input type="text" id="bf-dex" class="cloud-input" value="${st.DEX || '10 (+0)'}"></div>
                            <div style="flex:1;"><div class="tech-text">CON</div><input type="text" id="bf-con" class="cloud-input" value="${st.CON || '10 (+0)'}"></div>
                            <div style="flex:1;"><div class="tech-text">INT</div><input type="text" id="bf-int" class="cloud-input" value="${st.INT || '10 (+0)'}"></div>
                            <div style="flex:1;"><div class="tech-text">WIS</div><input type="text" id="bf-wis" class="cloud-input" value="${st.WIS || '10 (+0)'}"></div>
                            <div style="flex:1;"><div class="tech-text">CHA</div><input type="text" id="bf-cha" class="cloud-input" value="${st.CHA || '10 (+0)'}"></div>
                         </div>`;
                html += `<div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid #333; padding-bottom:8px; margin-bottom:12px; margin-top:12px;">
                            <div class="tech-text" style="color:var(--color-yellow);">ОСОБЕННОСТИ (TRAITS)</div>
                            <button class="btn-small-bld" onclick="window.addBItem('bf-traits-container', 'trait')">+ ДОБАВИТЬ</button>
                         </div><div id="bf-traits-container"></div>`;
                html += `<div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid #333; padding-bottom:8px; margin-bottom:12px; margin-top:12px;">
                            <div class="tech-text" style="color:var(--color-red);">ДЕЙСТВИЯ (ACTIONS)</div>
                            <button class="btn-small-bld" onclick="window.addBItem('bf-actions-container', 'action')">+ ДОБАВИТЬ</button>
                         </div><div id="bf-actions-container"></div>`;
                html += `<div class="tech-text" style="margin-bottom:4px; margin-top:12px;">ЛОР И ОПИСАНИЕ</div><textarea id="bf-lore" class="cloud-input" placeholder="(Поддерживает Markdown)">${data.Lore || ''}</textarea>`;
            }

            html += `
                <div class="builder-checkbox-group" style="margin-top: 16px; border-top: 1px dashed #333; padding-top: 12px;">
                    <label class="builder-checkbox-label" style="color: var(--color-red);">
                        <input type="checkbox" id="bf-isprivate" ${isPrivate ? 'checked' : ''}> 
                        <i class="fa-solid fa-eye-slash"></i> СДЕЛАТЬ ЗАПИСЬ ПРИВАТНОЙ (Только для вас и Администрации)
                    </label>
                </div>
            `;

            container.innerHTML = html;

            if (currentMode === 'status' && data.SideEffects) {
                data.SideEffects.forEach(se => window.addBItem('bf-side-container', 'sideeffect', se.sideeffectname, se.sideeffect));
            }
            if (currentMode === 'class' && data.Talents) {
                data.Talents.forEach(t => window.addBItem('bf-talent-container', 'talent', t.name, t.desc, t.level, t.Color||t.color));
            }
            if (currentMode === 'bestiary') {
                if (data.Traits) data.Traits.forEach(t => window.addBItem('bf-traits-container', 'trait', t.name, t.desc));
                if (data.Actions) data.Actions.forEach(a => window.addBItem('bf-actions-container', 'action', a.name, a.desc));
            }
        }

        window.addBItem = (containerId, type, v1='', v2='', v3='1', v4='') => {
            const container = document.getElementById(containerId);
            let html = '';
            if (type === 'sideeffect') {
                html = `<div class="b-se-entry"><button class="btn-small-bld" style="position:absolute; right:12px; top:12px; border-color:var(--color-red); color:var(--color-red);" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>
                        <input type="text" class="cloud-input ci-1" style="width:calc(100% - 40px);" placeholder="Название" value="${v1}">
                        <textarea class="cloud-input ci-2" placeholder="Описание (Поддерживает Markdown)" style="min-height:50px; margin-bottom:0;">${v2}</textarea></div>`;
            } else if (type === 'talent') {
                html = `<div class="b-se-entry"><button class="btn-small-bld" style="position:absolute; right:12px; top:12px; border-color:var(--color-red); color:var(--color-red);" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>
                        <div class="b-row" style="width:calc(100% - 40px);"><input type="text" class="cloud-input ci-1" style="flex:2;" placeholder="Название" value="${v1}">
                        <input type="number" class="cloud-input ci-3" style="flex:1;" placeholder="Ур." value="${v3}">
                        <input type="text" class="cloud-input ci-4" style="flex:1;" placeholder="HEX Цвет" value="${v4}"></div>
                        <textarea class="cloud-input ci-2" placeholder="Описание (Поддерживает Markdown)" style="min-height:50px; margin-bottom:0;">${v2}</textarea></div>`;
            } else if (type === 'trait' || type === 'action') {
                html = `<div class="b-se-entry"><button class="btn-small-bld" style="position:absolute; right:12px; top:12px; border-color:var(--color-red); color:var(--color-red);" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>
                        <input type="text" class="cloud-input ci-1" style="width:calc(100% - 40px);" placeholder="Название" value="${v1}">
                        <textarea class="cloud-input ci-2" placeholder="Описание (Поддерживает Markdown)" style="min-height:50px; margin-bottom:0;">${v2}</textarea></div>`;
            }
            container.insertAdjacentHTML('beforeend', html);
        };

        window.saveEntry = async () => {
            const name = document.getElementById('bf-name').value.trim();
            if (!name) return alert("Имя обязательно!");

            let saveData = { Name: name };

            if (currentMode === 'status') {
                saveData.Effect = document.getElementById('bf-effect').value;
                saveData.SideEffects = [];
                document.querySelectorAll('#bf-side-container .b-se-entry').forEach(el => {
                    saveData.SideEffects.push({ sideeffectname: el.querySelector('.ci-1').value, sideeffect: el.querySelector('.ci-2').value });
                });
            } 
            else if (currentMode === 'class') {
                saveData.Type = Array.from(document.querySelectorAll('.b-type-check:checked')).map(c=>c.value);
                saveData.Stats = Array.from(document.querySelectorAll('.b-stat-check:checked')).map(c=>c.value);
                saveData.Talents = [];
                document.querySelectorAll('#bf-talent-container .b-se-entry').forEach(el => {
                    saveData.Talents.push({ name: el.querySelector('.ci-1').value, desc: el.querySelector('.ci-2').value, level: parseInt(el.querySelector('.ci-3').value)||1, Color: el.querySelector('.ci-4').value });
                });
            }
            else if (currentMode === 'feat') {
                const nv = document.getElementById('bf-need').value.trim();
                saveData.Need = nv !== "" ? nv : null;
                saveData.Base = Array.from(document.querySelectorAll('.b-base-check:checked')).map(c=>c.value);
                saveData.desc = document.getElementById('bf-desc').value;
            }
            else if (currentMode === 'gift') {
                saveData.Level = parseInt(document.getElementById('bf-level').value) || 1;
                saveData.Type = Array.from(document.querySelectorAll('.b-type-check:checked')).map(c=>c.value);
                saveData.Description = document.getElementById('bf-desc').value;
            }
            else if (currentMode === 'equip') {
                saveData.Level = parseInt(document.getElementById('bf-level').value) || 1;
                saveData.ItemType = document.getElementById('bf-itemtype').value;
                saveData.Rarity = document.getElementById('bf-rarity').value;
                saveData.IsEGO = document.getElementById('bf-isego').checked;
                const nv = document.getElementById('bf-need').value.trim();
                saveData.Need = nv !== "" ? nv : null;
                saveData.Type = Array.from(document.querySelectorAll('.b-type-check:checked')).map(c=>c.value);
                saveData.Stats = Array.from(document.querySelectorAll('.b-stat-check:checked')).map(c=>c.value);
                saveData.Desc = document.getElementById('bf-desc').value;
            }
            else if (currentMode === 'bestiary') {
                saveData.Meta = document.getElementById('bf-meta').value;
                saveData.Category = Array.from(document.querySelectorAll('.b-cat-check:checked')).map(c=>c.value);
                saveData.ArmorClass = document.getElementById('bf-ac').value;
                saveData.HitPoints = document.getElementById('bf-hp').value;
                saveData.Speed = document.getElementById('bf-speed').value;
                saveData.Stats = {
                    STR: document.getElementById('bf-str').value, DEX: document.getElementById('bf-dex').value,
                    CON: document.getElementById('bf-con').value, INT: document.getElementById('bf-int').value,
                    WIS: document.getElementById('bf-wis').value, CHA: document.getElementById('bf-cha').value
                };
                saveData.Traits = [];
                document.querySelectorAll('#bf-traits-container .b-se-entry').forEach(el => {
                    saveData.Traits.push({ name: el.querySelector('.ci-1').value, desc: el.querySelector('.ci-2').value });
                });
                saveData.Actions = [];
                document.querySelectorAll('#bf-actions-container .b-se-entry').forEach(el => {
                    saveData.Actions.push({ name: el.querySelector('.ci-1').value, desc: el.querySelector('.ci-2').value });
                });
                saveData.Lore = document.getElementById('bf-lore').value;
            }

            const isPrivate = document.getElementById('bf-isprivate').checked;

            const payload = {
                type: currentMode,
                data: saveData,
                isPrivate: isPrivate,
                updatedAt: new Date().toISOString()
            };

            if (!currentEditId) {
                const nick = window.localStorage.getItem('custom_nickname') || currentUser.email.split('@')[0];
                payload.creatorEmail = currentUser.email;
                payload.creator = nick;
            }

            try {
                if (currentEditId) {
                    await setDoc(doc(db, "custom_content", currentEditId), payload, { merge: true });
                } else {
                    const newId = currentMode + '_' + Date.now();
                    await setDoc(doc(db, "custom_content", newId), payload);
                }
                window.closeBuilder();
                loadDatabase();
            } catch(e) { alert("Ошибка сохранения в базу данных. Проверьте права доступа к Firestore."); }
        };

        window.uploadJson = (e) => {
            if (!currentUser) {
                e.target.value = '';
                return alert("Авторизуйтесь для загрузки файлов.");
            }
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const dataArray = JSON.parse(event.target.result);
                    if (!Array.isArray(dataArray)) throw new Error("Файл должен содержать массив [ {...} ]");
                    
                    const nick = window.localStorage.getItem('custom_nickname') || currentUser.email.split('@')[0];

                    for (let item of dataArray) {
                        const newId = currentMode + '_' + Date.now() + Math.floor(Math.random()*1000);
                        const payload = {
                            type: currentMode,
                            creatorEmail: currentUser.email,
                            creator: nick,
                            data: item,
                            isPrivate: false, 
                            updatedAt: new Date().toISOString()
                        };
                        await setDoc(doc(db, "custom_content", newId), payload);
                    }
                    alert("Успешно загружено и синхронизировано!");
                    loadDatabase();
                } catch (err) {
                    alert("Ошибка формата файла.");
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.documentElement.style.setProperty('--accent-primary', '#45B3CB');
            loadDatabase();
        });
    </script>
</body>
</html>
