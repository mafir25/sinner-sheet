<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гримуар Классов / Class Compendium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:ital,wght@0,300;1,300;1,700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #070707; --bg-panel: #000000; --accent-primary: #D9772F; --accent-muted: #8B5A2B;
            --color-cyan: #45B3CB; --color-red: #C7243A; --color-indigo: #40E0D0; --color-yellow: #F1C40F;
            --color-orange: #E67E22; --color-lightblue: #ADD8E6; --text-main: #E0D8C8; --text-dim: #696969;
            --border-width: 1px; --chamfer: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif;
            min-height: 100vh; padding: 60px 20px 40px 20px; display: flex; flex-direction: column; align-items: center;
            background-image: linear-gradient(rgba(7,7,7,0.8), rgba(7,7,7,0.8)), repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
        }

        h1, h2, h3, h4, .oswald { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .lore-text { font-family: 'Merriweather', serif; font-style: italic; color: var(--accent-muted); font-size: 0.85rem; }
        .tech-text { font-family: 'Inter', sans-serif; color: var(--accent-primary); font-size: 0.8rem; }

        /* Навигация */
        .top-nav-btn { position: absolute; top: 10px; left: 20px; padding: 6px 12px; font-size: 0.8rem; border-color: var(--color-cyan); color: var(--color-cyan); font-family: 'Oswald', sans-serif; z-index: 100; background: var(--bg-main); text-decoration: none; display: flex; align-items: center; gap: 6px; border: 1px solid var(--color-cyan); cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .top-nav-btn:hover { background-color: var(--color-cyan); color: #000; }

        .header-bar { width: 100%; max-width: 1200px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--accent-muted); padding-bottom: 10px; }
        .header-title { color: var(--accent-primary); font-size: 1.5rem; letter-spacing: 2px; }

        /* --- Разделенные блоки Поиска и Фильтров --- */
        .filters-section { width: 100%; max-width: 1200px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; }
        
        /* Поиск (Тонкая строка) */
        .search-wrapper { background-color: var(--accent-muted); padding: var(--border-width); transition: background-color 0.2s; }
        .search-wrapper:focus-within { background-color: var(--accent-primary); }
        .search-inner { background: rgba(0,0,0,0.7); padding: 0; display: flex; align-items: center; flex-direction: row; }
        .search-icon { padding-left: 14px; font-size: 0.9rem; color: var(--text-dim); }
        .search-input { width: 100%; background: transparent; border: none; color: var(--text-main); padding: 8px 14px 8px 10px; font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; }
        .search-input::placeholder { color: var(--text-dim); }

        /* Кнопки Фильтров */
        .type-filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .filter-btn { display: flex; align-items: center; gap: 6px; font-family: 'Oswald', sans-serif; font-size: 0.85rem; text-transform: uppercase; border: 1px solid var(--text-dim); color: var(--text-dim); background: rgba(0,0,0,0.5); padding: 4px 10px; cursor: pointer; transition: 0.2s; border-radius: 2px; }
        .filter-btn:hover { border-color: var(--text-main); color: var(--text-main); }
        .filter-btn.active { border-color: var(--accent-primary); color: var(--accent-primary); background: rgba(217, 119, 47, 0.1); }
        .filter-btn .type-icon { width: 14px; height: 14px; object-fit: contain; }

        .compendium-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; align-items: start; }

        .panel-outer { background-color: var(--accent-primary); padding: var(--border-width); position: relative; display: flex; flex-direction: column; }
        .panel-inner { background-color: var(--bg-panel); padding: 16px; height: 100%; display: flex; flex-direction: column; }
        .cut-tl { clip-path: polygon(var(--chamfer) 0, 100% 0, 100% 100%, 0 100%, 0 var(--chamfer)); }

        /* Стили карточек (Сворачивание) */
        .card-header-clickable { cursor: pointer; position: relative; padding-right: 24px; user-select: none; }
        .card-header-clickable:hover .class-title { color: var(--color-orange); }
        .expand-icon { position: absolute; right: 0; top: 6px; color: var(--text-dim); transition: transform 0.3s ease; }
        .panel-outer.expanded .expand-icon { transform: rotate(180deg); color: var(--accent-primary); }

        .class-title { font-size: 1.4rem; color: var(--text-main); margin-bottom: 8px; transition: color 0.2s; border-bottom: 1px solid #222; padding-bottom: 4px; }
        
        .types-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .type-badge { display: flex; align-items: center; gap: 6px; font-family: 'Oswald', sans-serif; font-size: 0.9rem; text-transform: uppercase; border: 1px solid; padding: 2px 8px; border-radius: 2px; background: rgba(0,0,0,0.5); }
        .type-icon { width: 16px; height: 16px; object-fit: contain; }

        /* Контейнер для скрытых талантов */
        .talents-wrapper {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, margin-top 0.4s ease, opacity 0.3s ease;
        }
        
        .talent-block { margin-bottom: 16px; border-left: 2px solid var(--accent-muted); padding-left: 10px; }
        .talent-block:last-child { margin-bottom: 0; }
        .talent-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .talent-name { font-family: 'Oswald', sans-serif; color: var(--accent-primary); font-size: 1.1rem; }
        .talent-level { color: var(--text-dim); font-size: 0.75rem; }
        .talent-desc { font-size: 0.85rem; color: var(--text-main); line-height: 1.4; }

        .loading-text { text-align: center; color: var(--text-dim); font-family: 'Oswald', sans-serif; font-size: 1.2rem; width: 100%; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <a href="index.html" class="top-nav-btn"><i class="fa-solid fa-arrow-left"></i> ТЕРМИНАЛ АГЕНТА</a>

    <div class="header-bar">
        <div class="header-title oswald">БАЗА ДАННЫХ: АРХЕТИПЫ И КЛАССЫ</div>
    </div>

    <!-- Разделенный блок фильтров и поиска -->
    <div class="filters-section">
        <!-- Поиск (Тонкая строка) -->
        <div class="panel-outer cut-tl search-wrapper">
            <div class="panel-inner cut-tl search-inner">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" class="search-input" placeholder="Поиск по названию класса (Например: Инквизитор, Агент...)" onkeyup="window.filterClasses()">
            </div>
        </div>
        <!-- Кнопки типов (Генерируются скриптом) -->
        <div class="type-filters" id="type-filters">
            <!-- Кнопки появятся здесь -->
        </div>
    </div>

    <div class="compendium-grid" id="compendium">
        <div class="loading-text">Установка соединения с базой данных...</div>
    </div>

    <script>
        // Словарь тегов (с правильным порядком "Иное", затем "Нет")
        const typeDictionary = {
            "Burn": { name: "Огонь", color: "#C7243A", icon: "Burn.png" },
            "Bleed": { name: "Кровотечение", color: "#E67E22", icon: "Bleed.png" },
            "Tremor": { name: "Тремор", color: "#F1C40F", icon: "Tremor.png" },
            "Rupture": { name: "Разрыв", color: "#40E0D0", icon: "Rupture.png" },
            "Sinking": { name: "Утопание", color: "#45B3CB", icon: "Sinking.png" },
            "Poise": { name: "Уверенность", color: "#1E3A8A", icon: "Poise.png" },
            "Charge": { name: "Заряд", color: "#9B59B6", icon: "Charge.png" },
            "Other": { name: "Иное", color: "#00CED1", icon: "Other.png" }, 
            "None": { name: "Нет", color: "#696969", icon: "" } 
        };

        let currentTypeFilter = 'all';

        // Генерация кнопок фильтров
        function renderFilters() {
            const container = document.getElementById('type-filters');
            let html = `<button class="filter-btn active" data-filter="all" onclick="window.setTypeFilter('all', this)" style="border-color: var(--accent-primary); color: var(--accent-primary);">ВСЕ</button>`;
            
            for (const [key, data] of Object.entries(typeDictionary)) {
                const imgTag = data.icon ? `<img src="${data.icon}" class="type-icon" onerror="this.style.display='none'">` : '';
                html += `
                    <button class="filter-btn" data-filter="${key}" data-color="${data.color}" onclick="window.setTypeFilter('${key}', this)">
                        ${imgTag} ${data.name}
                    </button>
                `;
            }
            container.innerHTML = html;
        }

        // Логика нажатия на фильтр типа
        window.setTypeFilter = (type, btn) => {
            currentTypeFilter = type;
            
            // Сброс стилей всех кнопок
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('active');
                b.style.borderColor = 'var(--text-dim)';
                b.style.color = 'var(--text-dim)';
                b.style.backgroundColor = 'rgba(0,0,0,0.5)';
            });
            
            // Установка стиля активной кнопки
            btn.classList.add('active');
            if(type !== 'all') {
                const color = btn.getAttribute('data-color');
                btn.style.borderColor = color;
                btn.style.color = color;
                // Легкая подсветка фона под цвет стихии
                btn.style.backgroundColor = `color-mix(in srgb, ${color} 15%, transparent)`;
            } else {
                btn.style.borderColor = 'var(--accent-primary)';
                btn.style.color = 'var(--accent-primary)';
                btn.style.backgroundColor = 'rgba(217, 119, 47, 0.1)';
            }
            
            window.filterClasses();
        };

        // Логика комбинированного поиска (Текст + Тип)
        window.filterClasses = () => {
            const query = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.compendium-card');
            
            cards.forEach(card => {
                const nameData = card.getAttribute('data-name').toLowerCase();
                const typesData = card.getAttribute('data-types').split(' ');
                
                // Проверка имени
                const matchesName = nameData.includes(query);
                // Проверка типа (если выбран "all", то тип не важен)
                const matchesType = currentTypeFilter === 'all' || typesData.includes(currentTypeFilter);
                
                if (matchesName && matchesType) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        };

        // Логика разворачивания/сворачивания карточки
        window.toggleCard = (el) => {
            const card = el.closest('.panel-outer');
            const talentsWrapper = card.querySelector('.talents-wrapper');
            const isExpanded = card.classList.toggle('expanded');
            
            if (isExpanded) {
                talentsWrapper.style.maxHeight = talentsWrapper.scrollHeight + 30 + "px";
                talentsWrapper.style.marginTop = "16px";
                talentsWrapper.style.opacity = "1";
                setTimeout(() => { if (card.classList.contains('expanded')) talentsWrapper.style.maxHeight = 'none'; }, 400);
            } else {
                talentsWrapper.style.maxHeight = talentsWrapper.scrollHeight + "px";
                setTimeout(() => {
                    talentsWrapper.style.maxHeight = "0px";
                    talentsWrapper.style.marginTop = "0px";
                    talentsWrapper.style.opacity = "0";
                }, 10);
            }
        };

        // Загрузка JSON и генерация HTML
        async function loadGrimoire() {
            const container = document.getElementById('compendium');
            
            try {
                const response = await fetch('classes.json');
                if (!response.ok) throw new Error('Файл classes.json не найден');
                
                const classesData = await response.json();
                classesData.sort((a, b) => a.No - b.No);
                container.innerHTML = '';
                
                classesData.forEach(cls => {
                    let typesHtml = '';
                    
                    // Собираем типы для атрибута фильтрации
                    let typesString = (cls.Type && Array.isArray(cls.Type)) ? cls.Type.join(' ') : '';

                    if (cls.Type && Array.isArray(cls.Type)) {
                        cls.Type.forEach(typeKey => {
                            const config = typeDictionary[typeKey];
                            if (config) {
                                const imgTag = config.icon ? `<img src="${config.icon}" alt="${config.name}" class="type-icon" onerror="this.style.display='none'">` : '';
                                typesHtml += `
                                    <div class="type-badge" style="color: ${config.color}; border-color: ${config.color};">
                                        ${imgTag}
                                        ${config.name}
                                    </div>
                                `;
                            } else {
                                typesHtml += `<div class="type-badge" style="color: var(--text-main); border-color: var(--text-dim);">${typeKey}</div>`;
                            }
                        });
                    }

                    let talentsHtml = '';
                    if (cls.Talents && Array.isArray(cls.Talents)) {
                        cls.Talents.forEach(talent => {
                            talentsHtml += `
                                <div class="talent-block">
                                    <div class="talent-header">
                                        <div class="talent-name">${talent.name}</div>
                                        <div class="talent-level tech-text">Уровень: ${talent.level}</div>
                                    </div>
                                    <div class="talent-desc">${talent.desc}</div>
                                </div>
                            `;
                        });
                    }

                    // Сборка карточки с data-атрибутами для фильтрации
                    const safeName = cls.Name.replace(/"/g, '&quot;');
                    
                    const cardHtml = `
                        <div class="panel-outer cut-tl compendium-card" data-name="${safeName}" data-types="${typesString}">
                            <div class="hazard-tape" style="height: 6px; background: repeating-linear-gradient(45deg, #000 0px, #000 10px, var(--accent-muted) 10px, var(--accent-muted) 20px);"></div>
                            <div class="panel-inner cut-tl" style="border-top: none;">
                                
                                <div class="card-header-clickable" onclick="window.toggleCard(this)">
                                    <i class="fa-solid fa-chevron-down expand-icon"></i>
                                    <div class="class-title oswald">${cls.Name}</div>
                                    <div class="types-container">${typesHtml}</div>
                                </div>
                                
                                <div class="talents-wrapper">
                                    <div class="talents-container">
                                        ${talentsHtml}
                                    </div>
                                </div>

                            </div>
                        </div>
                    `;
                    
                    container.insertAdjacentHTML('beforeend', cardHtml);
                });

            } catch (error) {
                console.error("Ошибка загрузки гримуара:", error);
                container.innerHTML = `<div class="loading-text" style="color: var(--color-red);">Ошибка связи с базой данных.<br><span style="font-size: 0.8rem; color: var(--text-dim);">Убедитесь, что файл classes.json существует.</span></div>`;
            }
        }

        // Запуск при старте
        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            loadGrimoire();
        });
    </script>
</body>
</html>
